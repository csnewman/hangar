[package]
name = "hangar-vmm"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "A KVM virtual machine monitor that runs one Hangar environment"
publish = false

[dependencies]
kvm-bindings = { version = "0.14", features = ["fam-wrappers"] }
kvm-ioctls = "0.25"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
vm-fdt = "0.3"
vm-memory = { version = "=0.17.1", features = ["backend-mmap", "backend-atomic"] }
vm-superio = "0.8"
vmm-sys-util = "0.15"
virtio-bindings = "0.2"
virtio-queue = "0.17"
vhost = { version = "=0.16.0", features = ["vhost-kern", "vhost-vsock"] }
fuse-backend-rs = { version = "0.14", default-features = false, features = ["virtiofs"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
# Arithmetic here runs on lengths and offsets a hostile guest chose. A wrap
# that turns a bounds check into a pass is a far worse outcome than the
# process stopping, and with panic = "abort" that is what an overflow does.
overflow-checks = true
