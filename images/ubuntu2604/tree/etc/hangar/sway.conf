# The environment's desktop; see hangar-desktop.service.
#
# The headless backend creates one output, HEADLESS-1. Clients reach the
# session at WAYLAND_DISPLAY=wayland-1 in /run/user/1000.
output HEADLESS-1 resolution 1280x800 bg #2d4a6b solid_color
default_border normal
font pango:DejaVu Sans 11

bar {
    position top
    status_command while date +'%H:%M:%S'; do sleep 1; done
}
