# Hangar base image.
#
# mkosi builds a real OS image from distribution packages, rather than a
# container image that is later made to act like one. That difference is not
# cosmetic: a container image omits udev (a separate package on Debian/Ubuntu
# that --no-install-recommends drops), and carries container markers that make
# systemd boot in container mode. Both cost a debugging cycle on the Dockerfile
# path; neither can happen here.

[Distribution]
Distribution=ubuntu
Release=resolute
# Docker comes from Docker's own repository (see repo/), so main covers
# everything else the base installs.
# universe as well as main: Mesa's diagnostic tools live there, and so do
# the desktop packages this base is heading towards.
Repositories=main,universe

[Output]
Format=directory
Output=rootfs

[Content]
# Bootable=no: Hangar boots its own kernel directly, so the image needs no
# bootloader, no ESP and no kernel package at all. Keeping the kernel out of
# the image is what lets one kernel serve every base, and is why the Rocky base
# -- whose kernel package cannot be installed into a build root -- works too.
Bootable=no

# tree/ is shared with every other base; repo/ is Docker's apt repository,
# which ships in the image so `apt install` inside an environment resolves
# against the same source the image was built from.
ExtraTrees=../common/tree,repo,tree

# Without these, systemd-firstboot prompts interactively on first boot and the
# machine never reaches a usable state.
Locale=C.UTF-8
Timezone=UTC
Hostname=hangar
RootPassword=hangar
Autologin=yes

Packages=
        systemd
        systemd-sysv
        systemd-resolved
        udev
        dbus
        docker-ce
        docker-ce-cli
        containerd.io
        docker-buildx-plugin
        docker-compose-plugin
        iproute2
        iputils-ping
        ca-certificates
        curl
        # Templates clone repositories into a new environment, over HTTPS or
        # SSH, before anyone has had a chance to install anything.
        git
        openssh-client
        sudo
        # groupadd, which docker-ce's postinst calls to create the docker
        # group. mkosi's base does not include it.
        passwd
        less
        procps
        vim-tiny
        # Mesa, so the guest can use the virtio-gpu device. The renderer runs
        # on the host; these are the guest-side driver and the loader that
        # finds it. mesa-utils carries eglinfo and es2_info, which are how a
        # guest reports which renderer it actually got.
        libgl1-mesa-dri
        libglx-mesa0
        libegl1
        libgles2
        mesa-utils
        # Vulkan through venus: the guest-side driver is Mesa's virtio ICD,
        # which talks to the renderer over virtio-gpu blob resources.
        mesa-vulkan-drivers
        libvulkan1
        vulkan-tools
        # The desktop: sway is the compositor, and runs headless as well as on
        # a display, so an environment has a desktop whether or not anyone is
        # looking at it. grim captures it.
        sway
        grim
        fonts-dejavu-core
        # From Debian, through repo/etc/apt/sources.list.d/debian-chromium.
        chromium

[Build]
# The same repo/ tree, mounted where the package manager can see it while the
# image is built. Without this apt has no Docker repository to install from.
SandboxTrees=repo

[Validation]
# No signing or verity for a development base.
SecureBoot=no
