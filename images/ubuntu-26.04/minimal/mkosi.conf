# Hangar's minimal Ubuntu image: what an environment needs to boot, be reached
# and clone its repositories, and apt to add anything else. No Docker, no
# desktop and no everyday tools; base/ has those.

[Include]
Include=../distribution.conf

[Content]
# ../../common/minimal/tree is shared with every distribution; repo/ is
# Docker's apt repository, which ships in the image so `apt install docker-ce`
# resolves inside an environment. tree/ is this distribution's networking.
ExtraTrees=../../common/minimal/tree,repo,tree

# base/ is built on this tree and installs only its own packages on top, which
# needs apt's metadata left in place.
CleanPackageMetadata=no

Packages=
        systemd
        systemd-sysv
        systemd-resolved
        udev
        dbus
        # apt, so an environment installs what its work needs. Ubuntu's own
        # sources are written by mkosi.postinst.chroot, since mkosi's exist
        # only in the build sandbox.
        apt
        ubuntu-keyring
        ca-certificates
        # useradd, for the dev user.
        passwd
        sudo
        # Templates clone repositories into a new environment, over HTTPS or
        # SSH, before anyone has had a chance to install anything.
        git
        openssh-client

[Build]
# The same repo/ tree, mounted where apt can see it while the image is built.
SandboxTrees=repo
