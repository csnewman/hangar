# Hangar's base Ubuntu image: minimal/ plus Docker, the GPU's guest drivers, a
# desktop, a browser and the everyday tools. Built on minimal's tree, so it
# is always minimal plus these, and published as minimal's layer plus one.

[Include]
Include=../distribution.conf

[Content]
BaseTrees=../minimal/rootfs

# repo/ is Debian's apt repository, for Chromium alone; tree/ has what this
# distribution's desktop needs beyond the shared one.
ExtraTrees=../../common/base/tree,repo,tree

Packages=
        docker-ce
        docker-ce-cli
        containerd.io
        docker-buildx-plugin
        docker-compose-plugin
        # Everyday tools, which minimal leaves to the user.
        curl
        less
        vim-tiny
        procps
        iproute2
        iputils-ping
        # Mesa, so the guest can use the virtio-gpu device. The renderer runs
        # on the host; these are the guest-side driver and the loader that
        # finds it. mesa-utils carries eglinfo and es2_info, which are how a
        # guest reports which renderer it actually got.
        libgl1-mesa-dri
        libglx-mesa0
        libegl1
        libgles2
        mesa-utils
        # Vulkan through venus: the guest-side driver is Mesa's virtio ICD,
        # which talks to the renderer over virtio-gpu blob resources.
        mesa-vulkan-drivers
        libvulkan1
        vulkan-tools
        # The desktop: labwc is the compositor, and runs headless as well as
        # on a display, so an environment has a desktop whether or not anyone
        # is looking at it. Xwayland runs X11 programs on it, wlr-randr sets
        # its size, grim captures it, and foot is the terminal its menu opens.
        labwc
        xwayland
        wlr-randr
        grim
        foot
        # The desktop's VNC server. The agent starts it when someone opens the
        # Desktop tab, attached to labwc's session.
        wayvnc
        fonts-dejavu-core
        # From Debian, through repo/etc/apt/sources.list.d/debian-chromium.
        chromium

[Build]
# Docker's repository from minimal/ and Debian's from here, where apt can see
# them while the image is built.
SandboxTrees=../minimal/repo,repo
