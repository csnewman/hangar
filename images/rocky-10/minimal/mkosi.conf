# Hangar's minimal Rocky image: what an environment needs to boot, be reached
# and clone its repositories, and dnf to add anything else. No Docker, no
# desktop and no everyday tools; base/ has those.

[Include]
Include=../distribution.conf

[Content]
# ../../common/minimal/tree is shared with every distribution; repo/ is
# Docker's rpm repository, which ships in the image so `dnf install
# docker-ce` resolves inside an environment.
ExtraTrees=../../common/minimal/tree,repo

# base/ is built on this tree and installs only its own packages on top, which
# needs dnf's metadata left in place.
CleanPackageMetadata=no

Packages=
        systemd
        systemd-udev
        NetworkManager
        dbus
        dnf
        ca-certificates
        # useradd and runuser, for the dev user.
        shadow-utils
        util-linux
        hostname
        sudo
        # Templates clone repositories into a new environment, over HTTPS or
        # SSH, before anyone has had a chance to install anything. git-core
        # is git without its Perl-based extras.
        git-core
        openssh-clients

[Build]
# The same repo/ tree, mounted where dnf can see it while the image is built.
SandboxTrees=repo
