# Hangar's base Rocky image: minimal/ plus Docker, the GPU's guest drivers, a
# desktop, a browser and the everyday tools. Built on minimal's tree, so it
# is always minimal plus these, and published as minimal's layer plus one.

[Include]
Include=../distribution.conf

[Content]
BaseTrees=../minimal/rootfs
ExtraTrees=../../common/base/tree

Packages=
        docker-ce
        docker-ce-cli
        containerd.io
        docker-buildx-plugin
        docker-compose-plugin
        # Everyday tools, which minimal leaves to the user.
        git
        curl
        less
        vim-minimal
        procps-ng
        iproute
        iputils
        # Mesa, so the guest can use the virtio-gpu device, and Vulkan through
        # venus. The renderer runs on the host; these are the guest-side
        # drivers and loaders, and the tools that report what a guest got.
        mesa-dri-drivers
        mesa-libEGL
        libglvnd-gles
        mesa-vulkan-drivers
        vulkan-loader
        vulkan-tools
        mesa-demos
        # The desktop. EPEL has no labwc, wlr-randr or grim, so
        # mkosi.build.chroot compiles them; these are what they link against
        # at run time.
        wlroots
        libsfdo
        libxml2
        glib2
        cairo
        pango
        librsvg2
        libinput
        libxkbcommon
        libpng
        libjpeg-turbo
        pixman
        xcb-util-wm
        xorg-x11-server-Xwayland
        # The terminal the desktop's menu opens: Rocky has no foot.
        ptyxis
        # The desktop's VNC server. The agent starts it when someone opens the
        # Desktop tab, attached to labwc's session.
        wayvnc
        dejavu-sans-fonts
        dejavu-sans-mono-fonts
        chromium

# What mkosi.build.chroot compiles against, present only while it runs:
# none of it reaches the image.
BuildPackages=
        curl
        gcc
        meson
        ninja-build
        pkgconf-pkg-config
        tar
        gzip
        wlroots-devel
        wayland-devel
        wayland-protocols-devel
        libsfdo-devel
        libxml2-devel
        glib2-devel
        cairo-devel
        pango-devel
        librsvg2-devel
        libinput-devel
        libxkbcommon-devel
        libdrm-devel
        libpng-devel
        libjpeg-turbo-devel
        pixman-devel
        libxcb-devel
        xcb-util-wm-devel
        xorg-x11-server-Xwayland-devel

[Build]
SandboxTrees=../minimal/repo
# mkosi.build.chroot fetches the sources it compiles.
WithNetwork=yes
