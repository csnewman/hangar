# Rocky Linux 10, as both tiers build it: minimal/ from nothing, and base/ on
# top of minimal's tree.
#
# The same shape as images/ubuntu-26.04, with the RHEL-family differences
# called out. Most notably udev is `systemd-udev` here rather than a package
# called `udev` -- the same separate-subpackage trap, under a different name.

[Distribution]
Distribution=rocky
Release=10
# EPEL carries the desktop's packages; CRB, which mkosi enables itself, the
# headers base/'s build script compiles against.
Repositories=epel

[Output]
Format=directory
Output=rootfs

[Content]
# No kernel package: RHEL's kernel POSTTRANS scriptlet runs kernel-install,
# which fails in a build root. Nothing needs one -- the guest kernel comes
# from `hangar kernel` and is shared by every base.
Bootable=no

Locale=C.UTF-8
Timezone=UTC
Hostname=hangar
RootPassword=hangar
Autologin=yes

[Validation]
SecureBoot=no
