# Hangar base image, Rocky 9.
#
# The same shape as images/ubuntu2604, with the RHEL-family differences called
# out. Most notably udev is `systemd-udev` here rather than a package called
# `udev` -- the same separate-subpackage trap, under a different name.

[Distribution]
Distribution=rocky
Release=9

[Output]
Format=directory
Output=rootfs

[Content]
# No kernel package: RHEL's kernel POSTTRANS scriptlet runs kernel-install,
# which fails in a build root. Nothing needs one -- the guest kernel comes
# from `hangar kernel` and is shared by every base.
Bootable=no

# ../common/tree is shared with every other base; repo/ is Docker's rpm
# repository, which ships in the image so `dnf install` inside an environment
# resolves against the same source the image was built from.
ExtraTrees=../common/tree,repo

Locale=C.UTF-8
Timezone=UTC
Hostname=hangar
RootPassword=hangar
Autologin=yes

Packages=
        systemd
        systemd-udev
        # RHEL ships no systemd-networkd, so NetworkManager does DHCP here.
        # It needs no configuration: with no connection profiles present it
        # auto-creates one per ethernet device and leases an address.
        NetworkManager
        dbus
        dnf
        docker-ce
        docker-ce-cli
        containerd.io
        docker-buildx-plugin
        docker-compose-plugin
        iproute
        iputils
        ca-certificates
        curl
        sudo
        passwd
        procps-ng
        less

[Build]
# The same repo/ tree, mounted where the package manager can see it while the
# image is built. Without this dnf has no Docker repository to install from.
SandboxTrees=repo

[Validation]
SecureBoot=no
