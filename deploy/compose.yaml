# Hangar on real machines. From this directory, with .env beside it (see
# .env.example):
#
#   docker compose --profile control-plane up -d          # Postgres + server
#   docker compose --profile worker up -d                 # a worker
#
# The server and worker images are pulled from HANGAR_REGISTRY, where CI
# publishes them; `up --build` builds them from this checkout instead. The
# images profile builds a base image locally, for a worker.yaml that names a
# local copy rather than pulling it:
#
#   IMAGE=ubuntu2604 docker compose --profile images run --rm build-image
#
# One machine can run every profile; a worker machine runs only `worker` and
# `images`, pointed at the control plane in worker.yaml, and needs none of
# the control plane's settings. See README.md for what the host needs first.
name: hangar

services:
  postgres:
    profiles: [control-plane]
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: hangar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: hangar
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, hangar]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    profiles: [control-plane]
    build:
      context: ..
      dockerfile: cmd/hangar-server/Dockerfile
    image: ${HANGAR_REGISTRY:-ghcr.io/csnewman/hangar}/server:${HANGAR_VERSION:-latest}
    restart: unless-stopped
    environment:
      HANGAR_DATABASE_URL: postgres://hangar:${POSTGRES_PASSWORD:-}@postgres:5432/hangar?sslmode=disable
      HANGAR_PUBLIC_URL: ${HANGAR_PUBLIC_URL:-}
      HANGAR_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap-token
      # The first administrator, created only while there are no users.
      HANGAR_INITIAL_ADMIN_USERNAME: ${HANGAR_ADMIN_USERNAME:-admin}
      HANGAR_INITIAL_ADMIN_PASSWORD: ${HANGAR_ADMIN_PASSWORD:-}
      # The server is the authoritative DNS server for HANGAR_PUBLIC_URL's
      # host and everything under it, and serves HTTPS with certificates it
      # is issued for them by ACME. Setting a listen address to empty in
      # .env turns that part off, for a TLS terminator of your own.
      HANGAR_DNS_LISTEN: ${HANGAR_DNS_LISTEN-:53}
      HANGAR_DNS_ADDRESSES: ${HANGAR_DNS_ADDRESSES:-}
      HANGAR_DNS_NAMESERVERS: ${HANGAR_DNS_NAMESERVERS:-}
      HANGAR_TLS_LISTEN: ${HANGAR_TLS_LISTEN-:443}
      HANGAR_REDIRECT_LISTEN: ${HANGAR_REDIRECT_LISTEN-:80}
      HANGAR_ACME_EMAIL: ${HANGAR_ACME_EMAIL:-}
      HANGAR_ACME_CA: ${HANGAR_ACME_CA:-}
    secrets: [bootstrap-token]
    ports:
      - ${HANGAR_PUBLISH_ADDRESS:-0.0.0.0}:53:53/udp
      - ${HANGAR_PUBLISH_ADDRESS:-0.0.0.0}:53:53/tcp
      - ${HANGAR_PUBLISH_ADDRESS:-0.0.0.0}:443:443
      - ${HANGAR_PUBLISH_ADDRESS:-0.0.0.0}:80:80
      # Plain HTTP, for a TLS terminator of your own. Workers and browsers
      # use HANGAR_PUBLIC_URL.
      - ${HANGAR_LISTEN:-127.0.0.1:8081}:8081
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: [worker]
    build:
      context: ..
      dockerfile: cmd/hangar-worker/Dockerfile
      target: worker
    image: ${HANGAR_REGISTRY:-ghcr.io/csnewman/hangar}/worker:${HANGAR_VERSION:-latest}
    restart: unless-stopped
    # Not --privileged. The worker needs KVM, and the backends it starts
    # (passt, hangar-fs) sandbox themselves in namespaces, which needs
    # CAP_SYS_ADMIN and Docker's seccomp and AppArmor profiles out of the
    # way. Everything else is ordinary root in a container.
    devices:
      - /dev/kvm
      # For environments with a GPU backed by a real host GPU; without it
      # they render on the CPU.
      # - /dev/dri
    cap_add: [SYS_ADMIN]
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    volumes:
      - ./worker.yaml:/etc/hangar/worker.yaml:ro
      # Environments' disks. A host path, not a volume, so they sit on the
      # host's own filesystem and survive the container.
      - /var/lib/hangar:/var/lib/hangar
    secrets: [bootstrap-token]

  build-image:
    profiles: [images]
    build:
      context: ..
      dockerfile: cmd/hangar-worker/Dockerfile
      target: imagebuilder
    image: hangar-imagebuilder
    # mkosi creates user namespaces and mounts, as `hangar build` allows it.
    cap_add: [SYS_ADMIN]
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    environment:
      IMAGE: ${IMAGE:-ubuntu2604}
    volumes:
      - /var/lib/hangar/image-src/${IMAGE:-ubuntu2604}:/out

secrets:
  bootstrap-token:
    file: ${HANGAR_BOOTSTRAP_TOKEN_FILE:-./bootstrap-token}

volumes:
  pgdata:
