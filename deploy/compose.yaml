# Hangar on real machines. From this directory, with .env beside it (see
# .env.example):
#
#   docker compose --profile control-plane up -d          # Postgres + server
#   docker compose --profile worker up -d                 # a worker
#
# The server and worker images are pulled from HANGAR_REGISTRY, where CI
# publishes them; `up --build` builds them from this checkout instead. The
# images profile builds a base image locally, for a worker.yaml that names a
# local copy rather than pulling it:
#
#   IMAGE=ubuntu-26.04 docker compose --profile images run --rm build-image
#
# One machine can run every profile; a worker machine runs only `worker` and
# `images`, pointed at the control plane in worker.yaml, and needs none of
# the control plane's settings. See README.md for what the host needs first.
name: hangar

services:
  postgres:
    profiles: [control-plane]
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: hangar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: hangar
    # A directory on the host, not a Docker volume, so the database is where
    # backups and the host's own tools can see it. Postgres makes it its
    # own on first start.
    volumes:
      - ${HANGAR_DATA_DIR:-/var/lib/hangar-server}/postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, hangar]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    profiles: [control-plane]
    build:
      context: ..
      dockerfile: cmd/hangar-server/Dockerfile
    image: ${HANGAR_REGISTRY:-ghcr.io/csnewman/hangar}/server:${HANGAR_VERSION:-latest}
    restart: unless-stopped
    environment:
      HANGAR_DATABASE_URL: postgres://hangar:${POSTGRES_PASSWORD:-}@postgres:5432/hangar?sslmode=disable
      HANGAR_PUBLIC_URL: ${HANGAR_PUBLIC_URL:-}
      HANGAR_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap-token
      # Encrypts users' credentials and SSH keys in the database.
      HANGAR_SECRET_KEY_FILE: /run/secrets/secret-key
      # The first administrator, created only while there are no users.
      HANGAR_INITIAL_ADMIN_USERNAME: ${HANGAR_ADMIN_USERNAME:-admin}
      HANGAR_INITIAL_ADMIN_PASSWORD: ${HANGAR_ADMIN_PASSWORD:-}
      # The server is the authoritative DNS server for HANGAR_PUBLIC_URL's
      # host and everything under it, and serves HTTPS with certificates it
      # is issued for them by ACME. Setting a listen address to empty in
      # .env turns that part off, for a TLS terminator of your own.
      HANGAR_DNS_LISTEN: ${HANGAR_DNS_LISTEN-:53}
      HANGAR_DNS_ADDRESSES: ${HANGAR_DNS_ADDRESSES:-}
      HANGAR_DNS_NAMESERVERS: ${HANGAR_DNS_NAMESERVERS:-}
      HANGAR_TLS_LISTEN: ${HANGAR_TLS_LISTEN-:443}
      HANGAR_REDIRECT_LISTEN: ${HANGAR_REDIRECT_LISTEN-:80}
      HANGAR_ACME_EMAIL: ${HANGAR_ACME_EMAIL:-}
      HANGAR_ACME_CA: ${HANGAR_ACME_CA:-}
      # A certificate of your own, in ./tls, served instead of ACME's.
      HANGAR_TLS_CERT_FILE: ${HANGAR_TLS_CERT_FILE:-}
      HANGAR_TLS_KEY_FILE: ${HANGAR_TLS_KEY_FILE:-}
      # How editors' and the registry's hosts are named after the public
      # one: subdomain (code<short>.<host>) or prefix (code<short>-<host>). See
      # README.md.
      HANGAR_HOST_STYLE: ${HANGAR_HOST_STYLE:-subdomain}
      # The SSH gateway, in front of every environment: ssh
      # <environment>@<host> -p 2222. Empty turns it off.
      HANGAR_SSH_LISTEN: ${HANGAR_SSH_LISTEN-:2222}
      HANGAR_SSH_ADDRESS: ${HANGAR_SSH_ADDRESS:-}
      # Hangar's own container registry, at registry.<HANGAR_PUBLIC_URL's
      # host> (registry-<host> in the prefix style). Empty turns it off.
      HANGAR_REGISTRY_DIR: ${HANGAR_REGISTRY_DIR-/var/lib/hangar-server/registry}
      # Paths shared in every user's profile beside the built-in ones. See
      # README.md.
      HANGAR_PROFILE_PATHS: ${HANGAR_PROFILE_PATHS:-}
    volumes:
      - ${HANGAR_DATA_DIR:-/var/lib/hangar-server}/registry:/var/lib/hangar-server/registry
      # The directory, not the files, so that files replaced by renaming
      # new ones into place are seen.
      - ${HANGAR_TLS_DIR:-./tls}:/etc/hangar-server/tls:ro
    secrets: [bootstrap-token, secret-key]
    ports:
      - ${HANGAR_PUBLISH_ADDRESS:-0.0.0.0}:53:53/udp
      - ${HANGAR_PUBLISH_ADDRESS:-0.0.0.0}:53:53/tcp
      - ${HANGAR_PUBLISH_ADDRESS:-0.0.0.0}:443:443
      - ${HANGAR_PUBLISH_ADDRESS:-0.0.0.0}:80:80
      - ${HANGAR_PUBLISH_ADDRESS:-0.0.0.0}:2222:2222
      # Plain HTTP, for a TLS terminator of your own. Workers and browsers
      # use HANGAR_PUBLIC_URL.
      - ${HANGAR_LISTEN:-127.0.0.1:8081}:8081
    depends_on:
      postgres:
        condition: service_healthy
      data-dirs:
        condition: service_completed_successfully

  # The server runs as an unprivileged user (65532, the image's nonroot),
  # and a directory Docker makes on the host for a bind mount belongs to
  # root: this gives the server its own before it starts.
  data-dirs:
    profiles: [control-plane]
    image: busybox:1.37
    command: [chown, "65532:65532", /registry]
    volumes:
      - ${HANGAR_DATA_DIR:-/var/lib/hangar-server}/registry:/registry

  worker:
    profiles: [worker]
    build:
      context: ..
      dockerfile: cmd/hangar-worker/Dockerfile
      target: worker
    image: ${HANGAR_REGISTRY:-ghcr.io/csnewman/hangar}/worker:${HANGAR_VERSION:-latest}
    restart: unless-stopped
    # Not --privileged. The worker needs KVM, and the backends it starts
    # (passt, hangar-fs) sandbox themselves in namespaces, which needs
    # CAP_SYS_ADMIN and Docker's seccomp and AppArmor profiles out of the
    # way. Everything else is ordinary root in a container.
    devices:
      - /dev/kvm
      # For environments with a GPU backed by a real host GPU; without it
      # they render on the CPU.
      # - /dev/dri
    cap_add: [SYS_ADMIN]
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    volumes:
      - ./worker.yaml:/etc/hangar/worker.yaml:ro
      # Environments' disks, images and caches. A directory on the host,
      # not a volume, so they sit on the host's own filesystem and survive
      # the container. The worker sees it as /var/lib/hangar wherever it
      # is, which is what worker.yaml names.
      - ${HANGAR_WORKER_DATA_DIR:-/var/lib/hangar}:/var/lib/hangar
    secrets: [bootstrap-token]

  build-image:
    profiles: [images]
    build:
      context: ..
      dockerfile: cmd/hangar-worker/Dockerfile
      target: imagebuilder
    image: hangar-imagebuilder
    # mkosi creates user namespaces and mounts, as `hangar build` allows it.
    cap_add: [SYS_ADMIN]
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    environment:
      IMAGE: ${IMAGE:-ubuntu-26.04}
    volumes:
      - ${HANGAR_WORKER_DATA_DIR:-/var/lib/hangar}/image-src/${IMAGE:-ubuntu-26.04}:/out

secrets:
  bootstrap-token:
    file: ${HANGAR_BOOTSTRAP_TOKEN_FILE:-./bootstrap-token}
  secret-key:
    file: ${HANGAR_SECRET_KEY_FILE:-./secret-key}
