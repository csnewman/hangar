# The worker's configuration, as deploy/compose.yaml mounts it at
# /etc/hangar/worker.yaml. Paths are inside the worker container: /var/lib/hangar
# is the host's /var/lib/hangar, and /usr/share/hangar is the worker image's own.
server:
  # The control plane, as this machine reaches it. On a machine running both,
  # the compose network reaches the server by its service name.
  url: http://server:8081
  # The shared secret a new worker presents once, to be issued a credential.
  token_file: /run/secrets/bootstrap-token
  credential_file: /var/lib/hangar/worker-credential

node:
  # Unique per machine.
  name: worker-1
  labels:
    runtime: cloud-hypervisor

storage:
  images: /var/lib/hangar/images
  environments: /var/lib/hangar/env
  caches: /var/lib/hangar/caches

# Kept back for the host itself; environments are placed in the rest.
reserved:
  cpus: 1
  memory: 2GiB

# What is left is offered times these. vCPUs share cores by time, so offering
# several per core only slows guests that are busy at once. Offering more
# memory than the machine has relies on guests leaving theirs unused (the
# balloon returns it) and on swap for the rest: give the host swap at least
# the size of the difference, or a guest that uses all it was given is
# killed. The worker warns when swap is short.
# overcommit:
#   cpus: 4
#   memory: 1.5

runtime: cloud-hypervisor

vm:
  kernel: /usr/share/hangar/vmlinuz
  agent: /usr/share/hangar/hangar-agent
  editor: /usr/share/hangar/editor.ext4
  upper_gib: 32
  docker_gib: 64
  # Environments map their base's files from this machine's page cache
  # through a DAX window of this size, rather than each keeping a copy.
  dax_mib: 1024
  # Environments whose template asks for a virtual GPU get OpenGL; with
  # venus, Vulkan too, which the worker image's virglrenderer supports.
  # venus_restore carries a Vulkan program across a suspend (experimental;
  # without it the program ends on resume, as on losing a real GPU).
  # window_mib sizes the window GPU resources are mapped through.
  # gpu:
  #   venus: true
  #   venus_restore: false
  #   window_mib: 512
  # Images are pulled from their registries the first time an environment
  # needs them, and unpacked into storage.images as a root filesystem, which
  # environments are served over virtio-fs. A private registry needs
  # credentials:
  # registries:
  #   ghcr.io:
  #     username: someone
  #     password_file: /run/secrets/ghcr-token
  #
  # A reference can instead name a local copy, such as one the compose file's
  # build-image service built, which builds both of a distribution's tiers:
  #   IMAGE=ubuntu-26.04 docker compose --profile images run --rm build-image
  # images:
  #   ghcr.io/csnewman/hangar/base:ubuntu-26.04:
  #     base: /var/lib/hangar/image-src/ubuntu-26.04/base/rootfs
  #   ghcr.io/csnewman/hangar/minimal:ubuntu-26.04:
  #     base: /var/lib/hangar/image-src/ubuntu-26.04/minimal/rootfs
