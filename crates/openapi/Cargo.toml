[package]
name = "hangar-openapi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Hangar's HTTP APIs, generated from their OpenAPI specs"

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
futures-core = "0.3"
progenitor-client = "0.16"
regress = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"

[build-dependencies]
openapiv3 = "2.2"
prettyplease = "0.2"
progenitor = { version = "0.16", default-features = false }
serde_json.workspace = true
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
syn = "2"

[dev-dependencies]
tokio.workspace = true
