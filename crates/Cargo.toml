[workspace]
resolver = "3"
members = ["agent", "proto"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ropey = "1.6"
base64 = "0.22"
libc = "0.2"
notify = "8"
regex = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
