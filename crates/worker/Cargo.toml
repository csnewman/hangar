[package]
name = "hangar-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Holds the environments the control plane places on this machine"

[lib]
name = "hangar_worker"
path = "src/lib.rs"

[[bin]]
name = "hangar-worker"
path = "src/main.rs"

[dependencies]
base64.workspace = true
futures-util = { version = "0.3", features = ["sink"] }
hangar-api = { path = "../api" }
hangar-images = { path = "../images" }
hangar-nfs = { path = "../nfs" }
hangar-vm = { path = "../vm" }
libc.workspace = true
log = { version = "0.4", features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde.workspace = true
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["compat"] }
ureq = { version = "3", features = ["json", "platform-verifier"] }
yamux = "0.13"
