[package]
name = "hangar-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The guest agent: init, the control channel, and every service the host reaches in an environment"

[lib]
name = "hangar_agent"
path = "src/lib.rs"

[[bin]]
name = "hangar-agent"
path = "src/main.rs"

[dependencies]
base64.workspace = true
hangar-proto = { path = "../proto" }
crc32fast.workspace = true
flate2.workspace = true
libc.workspace = true
notify.workspace = true
regex.workspace = true
ropey.workspace = true
# The agent's SSH server. Its crypto is ring's, which the workspace has
# already, rather than aws-lc's default: ring cross-compiles for the guest
# with clang alone.
russh = { version = "0.65", default-features = false, features = ["ring"] }
russh-sftp = "3"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
