[package]
name = "hangar-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The hangar CLI: builds what workers boot, the guest kernel and the distributions' images"

[[bin]]
name = "hangar"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
flate2.workspace = true
libc.workspace = true
rust-embed = "8"
serde_json.workspace = true
sha2 = "0.10"
tar = { version = "0.4", default-features = false }

[dev-dependencies]
hangar-erofs = { path = "../erofs" }
hangar-images = { path = "../images" }
