[package]
name = "hangar-suite"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Black-box tests of a Hangar server binary"

[dependencies]
base64.workspace = true
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
futures-core = "0.3"
hangar-api = { path = "../api" }
hangar-openapi = { path = "../openapi" }
hangar-vm = { path = "../vm" }
hangar-worker = { path = "../worker" }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
postgres = "0.19"
rcgen = "0.14"
russh = { version = "0.65", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.13", default-features = false, features = ["cookies", "http2", "json"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
signature = "3.0.0"
tokio.workspace = true
tokio-tungstenite = "0.26"
x509-parser = "0.18"
