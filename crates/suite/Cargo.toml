[package]
name = "hangar-suite"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Black-box tests of a Hangar server binary"

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
futures-core = "0.3"
hangar-api = { path = "../api" }
hangar-openapi = { path = "../openapi" }
hangar-vm = { path = "../vm" }
hangar-worker = { path = "../worker" }
postgres = "0.19"
reqwest = { version = "0.13", default-features = false, features = ["cookies", "json"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = "0.26"
