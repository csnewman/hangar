[package]
name = "hangar-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Hangar's control plane: the web UI and its API, the client API, the worker API and placement"

[[bin]]
name = "hangar-server"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio", "ws"] }
base64.workspace = true
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
curve25519-dalek = "5.0.0"
form_urlencoded = "1"
futures-util = { version = "0.3", features = ["io", "sink"] }
hangar-api = { path = "../api" }
hangar-openapi = { path = "../openapi" }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
hmac = "0.12"
hyper = { version = "1", features = ["client", "http1", "server", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "service"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
md-5 = "0.10"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider"] }
ring = "0.17"
rustix = { version = "1", features = ["fs"] }
rust-embed = { version = "8", features = ["mime-guess"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
regex.workspace = true
serde.workspace = true
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
serde_json.workspace = true
signature = "3.0.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "sqlite", "chrono", "uuid", "json"] }
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
tower-service = "0.3"
url = "2"
yamux = "0.13"
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = "0.18"
