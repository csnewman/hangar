[package]
name = "hangar-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Hangar's control plane: the web UI and its API, the client API, the worker API and placement"

[[bin]]
name = "hangar-server"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
base64.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
hangar-openapi = { path = "../openapi" }
rand = "0.8"
serde.workspace = true
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }
tokio.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }
