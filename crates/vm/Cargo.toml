[package]
name = "hangar-vm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "An environment's machine: its monitor, disks, initramfs and host"

[lib]
name = "hangar_vm"
path = "src/lib.rs"

[dependencies]
base64.workspace = true
hangar-api = { path = "../api" }
hangar-erofs = { path = "../erofs" }
hangar-ext4 = { path = "../ext4" }
hangar-hub = { path = "../hub", features = ["server"] }
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
hangar-images = { path = "../images" }
hangar-layercheck = { path = "../layercheck" }
hangar-nfs = { path = "../nfs" }
libc.workspace = true
log = "0.4"
regex.workspace = true
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
hangar-agent = { path = "../agent" }
hangar-nfs = { path = "../nfs" }
