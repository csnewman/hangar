[package]
name = "hangar-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { version = "=0.9.0", features = [
    "tree-sitter-rust", "tree-sitter-go", "tree-sitter-typescript", "tree-sitter-tsx",
    "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-toml", "tree-sitter-yaml",
    "tree-sitter-markdown", "tree-sitter-bash", "tree-sitter-css", "tree-sitter-html",
    "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-java",
    "tree-sitter-ruby", "tree-sitter-make",
] }
alacritty_terminal = "0.26"
hangar-proto = { path = "../proto" }
async-channel = "2"
similar = "2.7"
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
lsp-types = { version = "0.97", features = ["proposed"] }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
ureq = { version = "3", features = ["json", "platform-verifier"] }
dirs = "6"
tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "async-io"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
gpui-component = { version = "=0.9.0", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "x11", "wayland", "runtime_shaders", "test-support"] }
pollster = "0.4"
ropey.workspace = true
