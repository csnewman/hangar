[package]
name = "hangar-images"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The worker's images: pulled from registries straight into EROFS, and the copies it keeps"

[lib]
name = "hangar_images"
path = "src/lib.rs"

[dependencies]
hangar-erofs = { path = "../erofs" }
tar = { version = "0.4", default-features = false }

[dev-dependencies]
sha2 = "0.10"
hex = "0.4"
tar = { version = "0.4", default-features = false }
