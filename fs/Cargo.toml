[package]
name = "hangar-fs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "virtio-fs vhost-user backend with a DAX window"

[dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
fuse-backend-rs = { version = "0.14", default-features = false, features = ["virtiofs"] }
libc = "0.2"
log = "0.4"
thiserror = "2"
vhost = { version = "0.16", features = ["vhost-user-backend"] }
vhost-user-backend = "0.22"
virtio-bindings = "0.2"
virtio-queue = "0.17"
vm-memory = { version = "0.17", features = ["backend-mmap", "backend-atomic"] }
vmm-sys-util = "0.15"
