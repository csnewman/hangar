# The API the web UI uses. It is served by hangar-server under /api/frontend
# and ships in the same binary as the UI that calls it, so it is unversioned
# and changes with the UI. Anything outside that binary -- scripts, other
# tools, integrations -- belongs on a versioned API instead.
#
# Both sides are generated from this file: `go generate ./internal/frontendapi`
# for the Go server interface, `npm run gen:api` in web/ for the TypeScript
# types.
#
# Access is declared here and enforced from here. Every operation needs a
# signed-in session unless it sets `security: []`, and an operation marked
# `x-hangar-admin: true` needs an administrator. The server reads both from
# this file at startup.
openapi: 3.0.3
info:
  title: Hangar frontend API
  version: unversioned

security:
  - session: []
  - token: []

paths:
  /api/frontend/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Login" }
      responses:
        "200":
          description: Signed in. The session is in a cookie the browser keeps.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Signed out, and the session ended.
          headers:
            Set-Cookie:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/me:
    get:
      operationId: getMe
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/me/password:
    post:
      operationId: changePassword
      description: >-
        Changes the signed-in user's password. Every other session they have
        is ended; this one continues.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePassword" }
      responses:
        "204":
          description: Changed.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/me/tokens:
    get:
      operationId: listTokens
      responses:
        "200":
          description: The signed-in user's access tokens.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createToken
      description: >-
        Make an access token, for tools outside the browser such as the VS
        Code extension. The token is in this reply and nowhere else, ever.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateToken" }
      responses:
        "201":
          description: The token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewAccessToken" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/me/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: revokeToken
      responses:
        "204":
          description: Revoked.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/me/profile:
    get:
      operationId: getProfile
      description: >-
        The signed-in user's profile: the files that follow them into every
        environment they own, and their SSH keys. A secret file is listed
        without its content.
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/me/profile/file:
    parameters:
      - name: path
        in: query
        required: true
        description: The file's path, relative to the home directory.
        schema: { type: string }
    get:
      operationId: getProfileFile
      responses:
        "200":
          description: The file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileFileContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putProfileFile
      description: >-
        Write a file. It reaches every running environment the user owns at
        once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutProfileFile" }
      responses:
        "200":
          description: The file as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileFile" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: deleteProfileFile
      description: Remove a file, from the profile and every environment.
      responses:
        "204":
          description: Removed.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/me/profile/paths:
    post:
      operationId: addProfilePath
      description: >-
        Share another path, relative to the home directory: a file, or a
        directory, ending in a slash, with everything under it. It is taken
        from and given to every environment the user owns.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfilePath" }
      responses:
        "204":
          description: Shared.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: removeProfilePath
      description: >-
        Stop sharing a path the user added. Each environment keeps its copy,
        as a file of its own.
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No longer shared.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/me/profile/login-keys:
    post:
      operationId: addLoginKey
      description: >-
        Add a public key to sign in to one's environments with over SSH:
        through the VS Code extension, or hangar-connect.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddLoginKey" }
      responses:
        "201":
          description: The key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginKey" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/me/profile/login-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: deleteLoginKey
      responses:
        "204":
          description: Removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/me/profile/keys:
    post:
      operationId: addSSHKey
      description: >-
        Add an SSH key: generated, or imported from a private key without a
        passphrase. The private key stays on the server; environments sign
        through it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddSSHKey" }
      responses:
        "201":
          description: The key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHKey" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/me/profile/keys/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: deleteSSHKey
      responses:
        "204":
          description: Removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/audit:
    get:
      operationId: listAudit
      description: >-
        The audit log, newest first. Each subject narrows it to events
        concerning that thing, as type:id -- environment:<id>,
        template:<id>, worker:<id>, image:<ref>, user:<id>, owner:<id>,
        actor:<id>. An administrator sees every event; anyone else sees
        only events about what they own, about them, or by them.
      parameters:
        - name: subject
          in: query
          schema:
            type: array
            items: { type: string }
        - name: before
          in: query
          description: An event ID; only older events are returned, for the next page.
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/people:
    get:
      operationId: listPeople
      description: >-
        Every enabled user, as others see them: for choosing collaborators.
      responses:
        "200":
          description: Enabled users, by username.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/templates:
    get:
      operationId: listTemplates
      responses:
        "200":
          description: >-
            Every template the caller may use: shared ones, and private ones
            they own or collaborate on (all of them, for an administrator).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "201":
          description: Created, owned by the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/templates/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getTemplate
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateTemplate
      description: >-
        Replaces the template's content. The owner and collaborators may do
        this; only the owner may change its visibility. Environments already
        made from it are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "200":
          description: The template as changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteTemplate
      description: >-
        Deletes the template. Only its owner may. Environments made from it
        keep their copy of what it said.
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/templates/{id}/collaborators:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: setTemplateCollaborators
      description: >-
        Replaces who, besides the owner, may edit the template. The owner and
        any collaborator may.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Collaborators" }
      responses:
        "200":
          description: The template with its new collaborators.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/users:
    get:
      operationId: listUsers
      x-hangar-admin: true
      responses:
        "200":
          description: Every user, by username.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createUser
      x-hangar-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUser" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/users/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      operationId: updateUser
      x-hangar-admin: true
      description: >-
        Changes a user. Setting a password or disabling the user ends their
        sessions. A change that would leave no enabled administrator is
        refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUser" }
      responses:
        "200":
          description: The user as changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteUser
      x-hangar-admin: true
      description: Removes a user who owns no environments.
      responses:
        "204":
          description: Removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/environments:
    get:
      operationId: listEnvironments
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: >-
            Every environment the caller may reach, oldest first: their own,
            or every user's for an administrator.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Environment" }
    post:
      operationId: createEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEnvironment" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "201":
          description: Created. Placement picks it up from here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/Invalid" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/environments/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getEnvironment
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: The environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteEnvironment
      description: >-
        Asks for the environment to be deleted. One its worker holds stays,
        desired "deleted", until the worker reports it gone; one no worker
        holds is removed at once.
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: Deletion is under way.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "204":
          description: Removed outright.
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/environments/{id}/start:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: startEnvironment
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: The environment, now desired running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/environments/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: stopEnvironment
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: The environment, now desired stopped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/environments/{id}/suspend:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: suspendEnvironment
      description: >-
        Write a running environment's memory to its worker's disk and stop
        it. Starting it again resumes it where it was. Stopping it discards
        the memory.
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: The environment, desired suspended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/environments/{id}/processes:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listProcesses
      description: >-
        What runs in the environment. CPU use is each process's share of one
        CPU since the previous listing, so a first listing shows none;
        asking every few seconds gives a live view.
      responses:
        "200":
          description: The processes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/frontend/environments/{id}/processes/{pid}/signal:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: pid
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: signalProcess
      description: >-
        Stop a process: TERM asks it to, KILL does not ask. The environment's
        init and agent are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignalProcess" }
      responses:
        "204":
          description: Sent.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/frontend/environments/{id}/terminals:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listTerminals
      description: >-
        The environment's terminal sessions. Each is a shell that runs until
        it exits, whoever is attached; a browser attaches to one over the
        WebSocket at /api/frontend/environments/{id}/terminal.
      responses:
        "200":
          description: Its sessions, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TerminalSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/frontend/environments/{id}/editor:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: openEditor
      description: >-
        Signs the caller in to the environment's editor, which is served on an
        origin of its own, and returns the URL to open it at. The URL carries
        a ticket that works once, within a minute.
      responses:
        "200":
          description: Where to open the editor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorURL" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/frontend/environments/{id}/desktop/size:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: resizeDesktop
      description: >-
        Sets the size of the environment's desktop, which everyone watching
        it sees change. Sizes outside 640x400 to 3840x2160 are brought within
        it, and odd sides rounded down. A viewer connects to the desktop over
        VNC on the WebSocket at /api/frontend/environments/{id}/desktop.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesktopSize" }
      responses:
        "204":
          description: Resized.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/frontend/environments/{id}/terminals/{session}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: session
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9a-f]{1,32}$" }
    delete:
      operationId: closeTerminal
      description: Ends a terminal session, hanging up on its shell.
      responses:
        "204":
          description: Ended.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/frontend/workers:
    get:
      operationId: listWorkers
      x-hangar-admin: true
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Every worker, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Worker" }

  /api/frontend/workers/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getWorker
      x-hangar-admin: true
      responses:
        "200":
          description: The worker, with its latest usage and its local images.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Worker" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteWorker
      x-hangar-admin: true
      description: >-
        Forgets a revoked worker that holds no environments, freeing its name
        to register again.
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "204":
          description: Removed.
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/workers/{id}/images/remove:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: removeWorkerImage
      x-hangar-admin: true
      description: >-
        Asks the worker to delete an image from its local store. Refused while
        an environment on the worker uses the image; otherwise the worker
        deletes it on its next sync, and fetches it again if it is needed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoveImage" }
      responses:
        "202":
          description: Asked for.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/workers/{id}/unknown/remove:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: removeUnknownEnvironments
      x-hangar-admin: true
      description: >-
        Asks the worker to power off and delete environments it runs that
        the server has no record of, disks and all. Each must be one the
        worker reports as unknown.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoveUnknownEnvironments" }
      responses:
        "202":
          description: Asked for.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/workers/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: revokeWorker
      x-hangar-admin: true
      description: >-
        Stops the worker's credential working. Its environments stay placed
        on it, because their disks are there.
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "204":
          description: Revoked.
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: hangar_session
    token:
      type: http
      scheme: bearer
      description: An access token (hgr_...) from the Account page, for tools outside the browser.

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    NotFound:
      description: No such object.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not signed in, or the credentials given were wrong.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Signed in, but only an administrator may do this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: The environment's worker cannot be reached from this server just now.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The request conflicts with the object's current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    RemoveUnknownEnvironments:
      type: object
      required: [environments]
      properties:
        environments:
          type: array
          minItems: 1
          items: { type: string }

    AuditEvent:
      type: object
      required: [id, at, actor, action, target, subjects, details]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/AuditActor" }
        action:
          type: string
          description: What happened, as noun.verb.
        target: { $ref: "#/components/schemas/AuditRef" }
        subjects:
          type: array
          items: { type: string }
        details:
          type: object
          additionalProperties: true
        ip:
          type: string
          description: Where the request came from. Shown to administrators only.

    AuditActor:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [person, system, worker, anonymous]
        id: { type: string }
        name: { type: string }

    AuditRef:
      type: object
      required: [type, id, name]
      properties:
        type: { type: string }
        id: { type: string }
        name: { type: string }

    ProcessList:
      type: object
      required: [processes, cpus, memory_bytes]
      properties:
        cpus: { type: integer }
        memory_bytes: { type: integer, format: int64 }
        processes:
          type: array
          items: { $ref: "#/components/schemas/Process" }

    Process:
      type: object
      required: [pid, ppid, user, name, command, state, cpu_percent, rss_bytes, threads, started]
      properties:
        pid: { type: integer }
        ppid: { type: integer }
        user: { type: string }
        name: { type: string }
        command: { type: string }
        state:
          type: string
          description: As /proc gives it -- R running, S sleeping, D waiting on I/O, Z a zombie.
        cpu_percent: { type: number }
        rss_bytes: { type: integer, format: int64 }
        threads: { type: integer }
        started: { type: string, format: date-time }
        protected:
          type: boolean
          description: The guest's init or its agent, which cannot be stopped from here.

    SignalProcess:
      type: object
      required: [signal]
      properties:
        signal:
          type: string
          enum: [TERM, KILL]

    LoginKey:
      type: object
      required: [id, name, public_key, fingerprint, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        public_key: { type: string }
        fingerprint: { type: string }
        created_at: { type: string, format: date-time }

    AddLoginKey:
      type: object
      required: [public_key]
      properties:
        name:
          type: string
          description: Absent takes the key's own comment.
        public_key:
          type: string
          description: In authorized_keys form, as in ~/.ssh/id_ed25519.pub.

    AccessToken:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    NewAccessToken:
      type: object
      required: [token, info]
      properties:
        token:
          type: string
          description: The token itself, shown this once.
        info: { $ref: "#/components/schemas/AccessToken" }

    CreateToken:
      type: object
      required: [name]
      properties:
        name: { type: string }
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: Absent never expires.

    ProfilePath:
      type: object
      required: [path]
      properties:
        path: { type: string }

    Profile:
      type: object
      required: [files, keys, login_keys, paths, own_paths, secrets]
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/ProfileFile" }
        keys:
          type: array
          items: { $ref: "#/components/schemas/SSHKey" }
        login_keys:
          type: array
          description: Public keys that sign the user in to their environments over SSH.
          items: { $ref: "#/components/schemas/LoginKey" }
        paths:
          type: array
          description: >-
            What a profile holds, relative to the home directory. One ending
            in a slash holds everything under it.
          items: { type: string }
        own_paths:
          type: array
          description: The paths among them the user added, which they may remove.
          items: { type: string }
        secrets:
          type: boolean
          description: >-
            Whether the server can keep secrets: without its key, credentials
            and SSH keys are refused.

    ProfileFile:
      type: object
      required: [path, size, mode, secret, updated_at]
      properties:
        path: { type: string }
        size: { type: integer }
        mode: { type: integer }
        secret:
          type: boolean
          description: A credential, whose content is never shown.
        updated_at: { type: string, format: date-time }

    ProfileFileContent:
      type: object
      required: [path, content, mode, updated_at]
      properties:
        path: { type: string }
        content: { type: string }
        mode: { type: integer }
        updated_at: { type: string, format: date-time }

    PutProfileFile:
      type: object
      required: [content]
      properties:
        content: { type: string }
        mode:
          type: integer
          description: Permission bits. Absent keeps the file's, or 0644.

    SSHKey:
      type: object
      required: [id, name, public_key, fingerprint, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        public_key:
          type: string
          description: In authorized_keys form, to add to GitHub and the like.
        fingerprint: { type: string }
        created_at: { type: string, format: date-time }

    AddSSHKey:
      type: object
      required: [name]
      properties:
        name: { type: string }
        private_key:
          type: string
          description: A private key to import. Absent generates an ed25519 key.

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    DesiredState:
      type: string
      description: What the environment's owner has asked for.
      enum: [running, stopped, suspended, deleted]

    Phase:
      type: string
      description: >-
        What the environment is doing, as its worker last reported.
        "pending" means no worker has reported on it yet.
      enum: [pending, starting, running, stopping, stopped, suspending, suspended, failed, deleting]

    Environment:
      type: object
      required: [id, owner_id, owner, name, template, spec, image, cpus, memory_mib, desired, phase, created_at, updated_at]
      properties:
        id: { type: string }
        owner_id: { type: string }
        owner:
          type: string
          description: The owner's username.
        name:
          type: string
          description: Unique among its owner's environments.
        template_id:
          type: string
          description: The template it was made from. Absent once that template is deleted.
        template:
          type: string
          description: That template's name when the environment was made.
        spec:
          $ref: "#/components/schemas/Spec"
        image: { type: string }
        cpus: { type: integer }
        memory_mib: { type: integer }
        desired: { $ref: "#/components/schemas/DesiredState" }
        phase: { $ref: "#/components/schemas/Phase" }
        reason:
          type: string
          description: Why the environment is in its phase, when there is more to say.
        worker_id:
          type: string
          description: The worker it is placed on. Absent until placed.
        worker:
          type: string
          description: That worker's name.
        stats:
          $ref: "#/components/schemas/EnvironmentStats"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateEnvironment:
      type: object
      required: [template_id, name]
      additionalProperties: false
      properties:
        template_id: { type: string }
        name:
          type: string
          description: >-
            A DNS label, since it becomes a hostname, and whatever else the
            template's name pattern demands.
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"

    Display:
      type: string
      description: Whether the environment has a graphical desktop.
      enum: [none, desktop]

    GPU:
      type: string
      description: >-
        virtual renders through a GPU shared with other environments;
        passthrough gives the environment a whole physical GPU.
      enum: [none, virtual, passthrough]

    Repo:
      type: object
      required: [url, path]
      additionalProperties: false
      properties:
        url: { type: string, minLength: 1 }
        ref:
          type: string
          description: Branch, tag or commit to check out. Empty for the default branch.
        path:
          type: string
          description: Where in the environment to clone it. Absolute.
        branch:
          type: string
          description: >-
            A new branch to create after cloning. In a template, {name} is
            replaced by the environment's name.

    Spec:
      type: object
      required: [image, cpus, memory_mib, display, gpu, repos, placement]
      additionalProperties: false
      properties:
        image: { type: string, minLength: 1 }
        cpus: { type: integer, minimum: 1, maximum: 64 }
        memory_mib: { type: integer, minimum: 512, maximum: 262144 }
        display: { $ref: "#/components/schemas/Display" }
        gpu: { $ref: "#/components/schemas/GPU" }
        repos:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/Repo" }
        editor_path:
          type: string
          description: The folder the editor opens on.
        trusted_folders:
          type: array
          description: >-
            Folders VS Code trusts without asking, beyond the repositories and
            the editor's folder, which it trusts anyway. Ignored when
            untrusted, where it trusts nothing.
          items: { type: string }
        untrusted:
          type: boolean
          description: >-
            For code the owner does not trust: the environment is never given
            their credentials -- Claude's sign-in, or signatures from their
            SSH keys -- though the rest of their profile still follows them
            in.
        placement:
          type: object
          description: >-
            Worker labels the environment requires: it runs only on a worker
            with every one of these labels, with these values.
          additionalProperties: { type: string }

    Person:
      type: object
      required: [id, username, display_name]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }

    Template:
      type: object
      required: [id, name, description, visibility, owner, collaborators, spec, environments, can_edit, can_manage, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        visibility: { $ref: "#/components/schemas/Visibility" }
        owner: { $ref: "#/components/schemas/Person" }
        collaborators:
          type: array
          items: { $ref: "#/components/schemas/Person" }
        spec: { $ref: "#/components/schemas/Spec" }
        name_pattern:
          type: string
          description: >-
            A regular expression an environment's whole name must match, such
            as a ticket ID.
        name_hint:
          type: string
          description: What name the pattern wants, in words.
        environments:
          type: integer
          description: How many environments made from it exist.
        can_edit:
          type: boolean
          description: Whether the caller may change the recipe and its collaborators.
        can_manage:
          type: boolean
          description: Whether the caller may also change its visibility, or delete it.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Visibility:
      type: string
      description: >-
        private: the owner and collaborators see it. shared: everyone does.
      enum: [private, shared]

    TemplateInput:
      type: object
      required: [name, visibility, spec]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        visibility: { $ref: "#/components/schemas/Visibility" }
        spec: { $ref: "#/components/schemas/Spec" }
        name_pattern: { type: string, maxLength: 500 }
        name_hint: { type: string, maxLength: 200 }

    Collaborators:
      type: object
      required: [user_ids]
      additionalProperties: false
      properties:
        user_ids:
          type: array
          maxItems: 100
          items: { type: string }

    Resources:
      type: object
      required: [cpus, memory_mib]
      properties:
        cpus: { type: integer }
        memory_mib: { type: integer }

    Worker:
      type: object
      required: [id, name, labels, capacity, allocated, online, revoked, unknown, created_at, images, pending_removals]
      properties:
        id: { type: string }
        name: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        capacity: { $ref: "#/components/schemas/Resources" }
        allocated:
          $ref: "#/components/schemas/Resources"
        online: { type: boolean }
        revoked: { type: boolean }
        unknown:
          type: array
          description: >-
            Environments the worker is running that the server has no record
            of. Reported, never stopped automatically.
          items: { type: string }
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        stats:
          $ref: "#/components/schemas/WorkerStats"
        images:
          type: array
          items: { $ref: "#/components/schemas/LocalImage" }
        pending_removals:
          type: array
          description: Images the worker has been asked to delete and still holds.
          items: { type: string }

    WorkerStats:
      type: object
      description: The worker's machine as a whole, as last measured.
      required: [cpu_percent, load1, memory_used_mib, memory_total_mib, disk_used_bytes, disk_total_bytes]
      properties:
        cpu_percent: { type: number }
        load1: { type: number }
        memory_used_mib: { type: integer }
        memory_total_mib: { type: integer }
        disk_used_bytes: { type: integer, format: int64 }
        disk_total_bytes: { type: integer, format: int64 }

    EnvironmentStats:
      type: object
      description: >-
        What a running environment uses, as its worker last measured it.
        Rates are per second.
      required: [cpu_percent, memory_used_mib, memory_total_mib, disk_used_bytes, disk_read_bps, disk_write_bps, net_rx_bps, net_tx_bps]
      properties:
        cpu_percent:
          type: number
          description: Of the environment's own vCPUs; 100 is all of them busy.
        memory_used_mib: { type: integer }
        memory_total_mib: { type: integer }
        disk_used_bytes:
          type: integer
          format: int64
          description: What its writable layer and Docker store take on the worker.
        disk_read_bps: { type: number }
        disk_write_bps: { type: number }
        net_rx_bps: { type: number }
        net_tx_bps: { type: number }

    LocalImage:
      type: object
      required: [ref, size_bytes, state, environments]
      properties:
        ref: { type: string }
        size_bytes: { type: integer, format: int64 }
        state:
          type: string
          enum: [ready, fetching]
        environments:
          type: array
          description: IDs of the environments on the worker using it.
          items: { type: string }

    TerminalSession:
      type: object
      required: [id, title, created_at, clients, cols, rows]
      properties:
        id: { type: string }
        title:
          type: string
          description: What the shell or the program in it last set as the window title.
        created_at: { type: string, format: date-time }
        clients:
          type: integer
          description: How many windows are attached to it.
        cols: { type: integer }
        rows: { type: integer }

    DesktopSize:
      type: object
      required: [width, height]
      additionalProperties: false
      properties:
        width: { type: integer, minimum: 1, maximum: 100000 }
        height: { type: integer, minimum: 1, maximum: 100000 }

    EditorURL:
      type: object
      required: [url]
      properties:
        url: { type: string }

    RemoveImage:
      type: object
      required: [ref]
      additionalProperties: false
      properties:
        ref: { type: string, minLength: 1 }

    Login:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }

    Me:
      type: object
      required: [id, username, display_name, admin, has_password]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        admin: { type: boolean }
        has_password:
          type: boolean
          description: Whether the user has a local password that they can change.
        ssh:
          $ref: "#/components/schemas/SSHGateway"

    SSHGateway:
      type: object
      description: >-
        Where the SSH gateway is reached: ssh <environment>@<host> -p <port>,
        with a sign-in key. Absent when the server runs none.
      required: [host, port, host_key]
      properties:
        host: { type: string }
        port: { type: integer }
        host_key:
          type: string
          description: >-
            The gateway's public host key, in known_hosts form without the
            host name, for clients to trust without asking.

    ChangePassword:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8 }

    User:
      type: object
      required: [id, username, display_name, admin, disabled, has_password, environments, created_at]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        admin: { type: boolean }
        disabled:
          type: boolean
          description: A disabled user cannot sign in. Their environments are kept.
        has_password: { type: boolean }
        environments:
          type: integer
          description: How many environments the user owns.
        created_at: { type: string, format: date-time }

    CreateUser:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._@-]{0,62}$"
        display_name: { type: string, maxLength: 200 }
        password: { type: string, minLength: 8 }
        admin: { type: boolean }

    UpdateUser:
      type: object
      additionalProperties: false
      description: Only the fields present are changed.
      properties:
        display_name: { type: string, maxLength: 200 }
        admin: { type: boolean }
        disabled: { type: boolean }
        password: { type: string, minLength: 8 }
