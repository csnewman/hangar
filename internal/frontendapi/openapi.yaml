# The API the web UI uses. It is served by hangar-server under /api/frontend
# and ships in the same binary as the UI that calls it, so it is unversioned
# and changes with the UI. Anything outside that binary -- scripts, other
# tools, integrations -- belongs on a versioned API instead.
#
# Both sides are generated from this file: `go generate ./internal/frontendapi`
# for the Go server interface, `npm run gen:api` in web/ for the TypeScript
# types.
#
# Access is declared here and enforced from here. Every operation needs a
# signed-in session unless it sets `security: []`, and an operation marked
# `x-hangar-admin: true` needs an administrator. The server reads both from
# this file at startup.
openapi: 3.0.3
info:
  title: Hangar frontend API
  version: unversioned

security:
  - session: []
  - token: []

paths:
  /api/frontend/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Login" }
      responses:
        "200":
          description: Signed in. The session is in a cookie the browser keeps.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Signed out, and the session ended.
          headers:
            Set-Cookie:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/me:
    get:
      operationId: getMe
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/me/password:
    post:
      operationId: changePassword
      description: >-
        Changes the signed-in user's password. Every other session they have
        is ended; this one continues.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePassword" }
      responses:
        "204":
          description: Changed.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/me/tokens:
    get:
      operationId: listTokens
      responses:
        "200":
          description: The signed-in user's access tokens.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createToken
      description: >-
        Make an access token, for tools outside the browser such as the VS
        Code extension. The token is in this reply and nowhere else, ever.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateToken" }
      responses:
        "201":
          description: The token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewAccessToken" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/me/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: revokeToken
      responses:
        "204":
          description: Revoked.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/me/profile:
    get:
      operationId: getProfile
      description: >-
        The signed-in user's keys: the SSH keys environments sign with, and
        the public keys that sign them in to their environments.
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/packs:
    get:
      operationId: listPacks
      description: >-
        The packs the signed-in user may use: the built-in ones, those
        attached to everyone, their own, and their teams'. Every pack, for
        an administrator.
      responses:
        "200":
          description: The packs, the built-in ones first, then by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createPack
      description: >-
        Make a pack, owned by the team it names, which the user must be a
        member or admin of, or else by the user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackInput" }
      responses:
        "201":
          description: The pack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pack" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/frontend/packs/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getPack
      responses:
        "200":
          description: The pack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updatePack
      description: >-
        Change a pack's name, description, attach rule and paths. Its owner
        stays. Copies keep their files under a path taken out, unshared;
        environments copy them down as their own.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackInput" }
      responses:
        "200":
          description: The pack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pack" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deletePack
      description: >-
        Delete a pack and every copy of its files. A built-in pack is not
        deleted: attach it to nothing instead.
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/packs/{id}/copies:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listCopies
      description: >-
        The copies of a pack the user may use: their own first, made if
        they have none yet, then the shared ones.
      responses:
        "200":
          description: The copies.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Copy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createCopy
      description: >-
        Make a shared copy of the pack, owned by the team it names, which
        the user must be a member or admin of, or else by the user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopyInput" }
      responses:
        "201":
          description: The copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Copy" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/packs/{id}/default:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: setDefaultCopy
      description: >-
        The copy the user uses of the pack, unless an environment or its
        template says otherwise. Without one, their own.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopyChoice" }
      responses:
        "204":
          description: Set.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/copies/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getCopy
      description: A copy, its pack, and its files.
      responses:
        "200":
          description: The copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopyFiles" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: renameCopy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopyName" }
      responses:
        "200":
          description: The copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Copy" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteCopy
      description: >-
        Delete a copy and its files. Environments that used it are given
        another; a person who deletes their own is given an empty one.
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/copies/{id}/file:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: path
        in: query
        required: true
        description: The file's path, ~/ in the home directory or absolute.
        schema: { type: string }
    get:
      operationId: getCopyFile
      responses:
        "200":
          description: The file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackFileContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putCopyFile
      description: >-
        Write a file under one of the pack's paths. It reaches every running
        environment using the copy at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutPackFile" }
      responses:
        "200":
          description: The file as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackFile" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: setCopyFileMode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackFileMode" }
      responses:
        "200":
          description: The file as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackFile" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteCopyFile
      description: Remove a file, from the copy and every environment using it.
      responses:
        "204":
          description: Removed.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/me/profile/login-keys:
    post:
      operationId: addLoginKey
      description: >-
        Add a public key to sign in to one's environments with over SSH:
        through the VS Code extension, or hangar-connect.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddLoginKey" }
      responses:
        "201":
          description: The key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginKey" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/me/profile/login-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: deleteLoginKey
      responses:
        "204":
          description: Removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/me/profile/keys:
    post:
      operationId: addSSHKey
      description: >-
        Add an SSH key: generated, or imported from a private key without a
        passphrase. The private key stays on the server; environments sign
        through it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddSSHKey" }
      responses:
        "201":
          description: The key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHKey" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/me/profile/keys/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: deleteSSHKey
      responses:
        "204":
          description: Removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/audit:
    get:
      operationId: listAudit
      description: >-
        The audit log, newest first. Each subject narrows it to events
        concerning that thing, as type:id -- environment:<id>,
        template:<id>, worker:<id>, image:<ref>, user:<id>, owner:<id>,
        actor:<id>. An administrator sees every event; anyone else sees
        only events about what they own, about them, or by them.
      parameters:
        - name: subject
          in: query
          schema:
            type: array
            items: { type: string }
        - name: before
          in: query
          description: An event ID; only older events are returned, for the next page.
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/people:
    get:
      operationId: listPeople
      description: >-
        Every enabled user, as others see them: for choosing collaborators.
      responses:
        "200":
          description: Enabled users, by username.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/frontend/teams:
    get:
      operationId: listTeams
      description: >-
        Every team, with the caller's role in each: for choosing a template's
        owner or collaborators.
      responses:
        "200":
          description: Teams, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createTeam
      x-hangar-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeam" }
      responses:
        "201":
          description: Created, with no members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/teams/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getTeam
      responses:
        "200":
          description: The team and its members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateTeam
      description: Changes the team's name and description. Its admins may.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamInput" }
      responses:
        "200":
          description: The team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteTeam
      x-hangar-admin: true
      description: Deletes a team that owns nothing.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/teams/{id}/members/{user}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: user
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: setTeamMember
      description: Adds a user to the team, or changes their role. Its admins may.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamMembership" }
      responses:
        "200":
          description: The team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeTeamMember
      description: Takes a user out of the team. Its admins may.
      responses:
        "200":
          description: The team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/images:
    get:
      operationId: listImageRepositories
      description: >-
        The repositories in Hangar's registry the caller may pull. Absent
        when the server runs no registry.
      responses:
        "200":
          description: Repositories, by path.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImageRepository" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/images/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getImageRepository
      responses:
        "200":
          description: The repository and its tags.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageRepository" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateImageRepository
      description: Changes who may pull the repository, and its description. Its owner may.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageRepositoryInput" }
      responses:
        "200":
          description: The repository.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageRepository" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteImageRepository
      description: Deletes the repository with its tags. Its owner may.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/images/{id}/collaborators:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: setImageRepositoryCollaborators
      description: >-
        Replaces the users, who push, and teams, whose viewers pull and whose
        members push, besides the owner. Anyone who may push may.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Collaborators" }
      responses:
        "200":
          description: The repository.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageRepository" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/images/{id}/tags/{tag}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: tag
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteImageTag
      description: Removes a tag. Anyone who may push may.
      responses:
        "200":
          description: The repository.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageRepository" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/templates:
    get:
      operationId: listTemplates
      responses:
        "200":
          description: >-
            Every template the caller may use: shared ones, and private ones
            they own or collaborate on (all of them, for an administrator).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "201":
          description: Created, owned by the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/templates/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getTemplate
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateTemplate
      description: >-
        Replaces the template's content. The owner and collaborators may do
        this; only the owner may change its visibility. Environments already
        made from it are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "200":
          description: The template as changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteTemplate
      description: >-
        Deletes the template. Only its owner may. Environments made from it
        keep their copy of what it said.
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/templates/{id}/collaborators:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: setTemplateCollaborators
      description: >-
        Replaces the users and teams who, besides the owner, may work on the
        template. The owner and anyone who may edit it may.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Collaborators" }
      responses:
        "200":
          description: The template with its new collaborators.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/users:
    get:
      operationId: listUsers
      x-hangar-admin: true
      responses:
        "200":
          description: Every user, by username.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createUser
      x-hangar-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUser" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/users/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      operationId: updateUser
      x-hangar-admin: true
      description: >-
        Changes a user. Setting a password or disabling the user ends their
        sessions. A change that would leave no enabled administrator is
        refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUser" }
      responses:
        "200":
          description: The user as changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteUser
      x-hangar-admin: true
      description: Removes a user who owns no environments.
      responses:
        "204":
          description: Removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/environments:
    get:
      operationId: listEnvironments
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: >-
            Every environment the caller may reach, oldest first: their own,
            or every user's for an administrator.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Environment" }
    post:
      operationId: createEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEnvironment" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "201":
          description: Created. Placement picks it up from here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/Invalid" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/environments/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getEnvironment
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: The environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteEnvironment
      description: >-
        Asks for the environment to be deleted. One its worker holds stays,
        desired "deleted", until the worker reports it gone; one no worker
        holds is removed at once.
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: Deletion is under way.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "204":
          description: Removed outright.
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/environments/{id}/packs:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listEnvironmentPacks
      description: >-
        The packs the environment has, in order -- those its template
        lists, then those attaching themselves to it -- and the copy it uses
        of each.
      responses:
        "200":
          description: The packs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AttachedPack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/environments/{id}/packs/{pack}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - { name: pack, in: path, required: true, schema: { type: string } }
    put:
      operationId: chooseEnvironmentCopy
      description: >-
        The copy the environment uses of one of its packs. Without one, the
        template's pin, the one it was first given, or its owner's default.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopyChoice" }
      responses:
        "204":
          description: Chosen.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/environments/{id}/conflicts:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listEnvironmentConflicts
      description: >-
        Paths the environment had a file of its own at, differing from its
        copy's, when they became shared. The copy's is used; the
        environment's is kept aside until someone resolves it.
      responses:
        "200":
          description: The conflicts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FileConflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: resolveEnvironmentConflict
      description: >-
        Resolve a conflict: keep the copy's file (shared), or write the
        environment's over it (environment), which everyone using the copy
        then has.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveConflict" }
      responses:
        "204":
          description: Recorded; the environment's agent does it.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/environments/{id}/start:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: startEnvironment
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: The environment, now desired running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/environments/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: stopEnvironment
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: The environment, now desired stopped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/environments/{id}/settings:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: updateEnvironmentSettings
      description: >-
        Changes a stopped environment's size, display and GPU, which take
        effect when it next starts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentSettings" }
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/environments/{id}/reset-to-template:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: resetEnvironmentToTemplate
      description: >-
        Gives a stopped environment its template's current settings,
        keeping its disks. Refused when the template names another image or
        other repositories, or placement its worker does not meet.
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/environments/{id}/image/upgrade:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: upgradeEnvironmentImage
      description: >-
        Re-pins a stopped environment to the newer copy of its image its worker holds, at its next start, keeping its disks and a copy of its writable disk to roll back to. Refused, unless forced, when files it has changed would hide the newer image's, or before that has been checked.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageUpgrade" }
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/environments/{id}/image/rollback:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: rollbackEnvironmentImage
      description: >-
        Puts a stopped environment back as it was before its last upgrade, at its next start: the copy of the image and the writable disk it had, losing what has been written to that disk since.
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/environments/{id}/image/keep:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: keepEnvironmentImage
      description: >-
        Keeps an environment's upgrade and discards the copy of its writable disk kept to roll back to.
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/environments/{id}/image/cancel:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: cancelEnvironmentImageChange
      description: >-
        Withdraws an upgrade or rollback its next start would make.
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/environments/{id}/ports:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: setEnvironmentPorts
      description: >-
        Says whether anyone may reach the environment's own web servers, on
        its <anything>-env<short> hosts, without signing in to Hangar, or only
        those who may reach the environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public]
              additionalProperties: false
              properties:
                public: { type: boolean }
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/environments/{id}/ports/sign-in:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: signInEnvironmentPorts
      description: >-
        Where a browser opening a private environment's own web server is
        sent: it signs the browser in to that host, for the Hangar session
        it has here, and sends it back to the URL it asked for. Without a
        session it goes to Hangar's sign-in page first, and on from there.
      security: []
      parameters:
        - name: to
          in: query
          required: true
          description: The URL asked for, on one of the environment's hosts.
          schema: { type: string }
      responses:
        "303":
          description: On to the environment's host, or to sign in.
          headers:
            Location:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/frontend/environments/{id}/logs/{log}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: log
        in: path
        required: true
        schema: { $ref: "#/components/schemas/EnvironmentLogName" }
    get:
      operationId: getEnvironmentLog
      description: >-
        Part of one of the environment's logs, from its worker: what follows
        offset, or with no offset the end. Kept from its last start, so a
        start that failed can be looked into.
      parameters:
        - name: offset
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Part of the log.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogPart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/frontend/environments/{id}/suspend:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: suspendEnvironment
      description: >-
        Write a running environment's memory to its worker's disk and stop
        it. Starting it again resumes it where it was. Stopping it discards
        the memory.
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: The environment, desired suspended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/environments/{id}/processes:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listProcesses
      description: >-
        What runs in the environment. CPU use is each process's share of one
        CPU since the previous listing, so a first listing shows none;
        asking every few seconds gives a live view.
      responses:
        "200":
          description: The processes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/frontend/environments/{id}/processes/{pid}/signal:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: pid
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: signalProcess
      description: >-
        Stop a process: TERM asks it to, KILL does not ask. The environment's
        init and agent are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignalProcess" }
      responses:
        "204":
          description: Sent.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/frontend/environments/{id}/terminals:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listTerminals
      description: >-
        The environment's terminal sessions. Each is a shell that runs until
        it exits, whoever is attached; a browser attaches to one over the
        WebSocket at /api/frontend/environments/{id}/terminal.
      responses:
        "200":
          description: Its sessions, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TerminalSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/frontend/environments/{id}/editor:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: openEditor
      description: >-
        Signs the caller in to the environment's editor, which is served on an
        origin of its own, and returns the URL to open it at. The URL carries
        a ticket that works once, within a minute.
      responses:
        "200":
          description: Where to open the editor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorURL" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/frontend/environments/{id}/desktop/size:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: resizeDesktop
      description: >-
        Sets the size of the environment's desktop, which everyone watching
        it sees change. Sizes outside 640x400 to 3840x2160 are brought within
        it, and odd sides rounded down. A viewer connects to the desktop over
        VNC on the WebSocket at /api/frontend/environments/{id}/desktop.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesktopSize" }
      responses:
        "204":
          description: Resized.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/frontend/environments/{id}/terminals/{session}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: session
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9a-f]{1,32}$" }
    delete:
      operationId: closeTerminal
      description: Ends a terminal session, hanging up on its shell.
      responses:
        "204":
          description: Ended.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/frontend/workers:
    get:
      operationId: listWorkers
      x-hangar-admin: true
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Every worker, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Worker" }

  /api/frontend/workers/{id}/log:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getWorkerLog
      x-hangar-admin: true
      description: >-
        Part of the worker's own log, the latest of which it keeps in
        memory: what follows offset, or with no offset the end.
      parameters:
        - name: offset
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Part of the log.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogPart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/frontend/workers/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getWorker
      x-hangar-admin: true
      responses:
        "200":
          description: The worker, with its latest usage and its local images.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Worker" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteWorker
      x-hangar-admin: true
      description: >-
        Forgets a revoked worker that holds no environments, freeing its name
        to register again.
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "204":
          description: Removed.
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/workers/{id}/images/remove:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: removeWorkerImage
      x-hangar-admin: true
      description: >-
        Asks the worker to delete an image from its local store. Refused while
        an environment on the worker uses the image; otherwise the worker
        deletes it on its next sync, and fetches it again if it is needed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageCopy" }
      responses:
        "202":
          description: Asked for.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/frontend/workers/{id}/unknown/remove:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: removeUnknownEnvironments
      x-hangar-admin: true
      description: >-
        Asks the worker to power off and delete environments it runs that
        the server has no record of, disks and all. Each must be one the
        worker reports as unknown.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoveUnknownEnvironments" }
      responses:
        "202":
          description: Asked for.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/frontend/workers/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: revokeWorker
      x-hangar-admin: true
      description: >-
        Stops the worker's credential working. Its environments stay placed
        on it, because their disks are there.
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "204":
          description: Revoked.
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: hangar_session
    token:
      type: http
      scheme: bearer
      description: An access token (hgr_...) from the Account page, for tools outside the browser.

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    NotFound:
      description: No such object.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not signed in, or the credentials given were wrong.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Signed in, but only an administrator may do this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: The environment's worker cannot be reached from this server just now.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The request conflicts with the object's current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    RemoveUnknownEnvironments:
      type: object
      required: [environments]
      properties:
        environments:
          type: array
          minItems: 1
          items: { type: string }

    AuditEvent:
      type: object
      required: [id, at, actor, action, target, subjects, details]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/AuditActor" }
        action:
          type: string
          description: What happened, as noun.verb.
        target: { $ref: "#/components/schemas/AuditRef" }
        subjects:
          type: array
          items: { type: string }
        details:
          type: object
          additionalProperties: true
        ip:
          type: string
          description: Where the request came from. Shown to administrators only.

    AuditActor:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [person, system, worker, anonymous]
        id: { type: string }
        name: { type: string }

    AuditRef:
      type: object
      required: [type, id, name]
      properties:
        type: { type: string }
        id: { type: string }
        name: { type: string }

    ProcessList:
      type: object
      required: [processes, cpus, memory_bytes]
      properties:
        cpus: { type: integer }
        memory_bytes: { type: integer, format: int64 }
        processes:
          type: array
          items: { $ref: "#/components/schemas/Process" }

    Process:
      type: object
      required: [pid, ppid, user, name, command, state, cpu_percent, rss_bytes, threads, started]
      properties:
        pid: { type: integer }
        ppid: { type: integer }
        user: { type: string }
        name: { type: string }
        command: { type: string }
        state:
          type: string
          description: As /proc gives it -- R running, S sleeping, D waiting on I/O, Z a zombie.
        cpu_percent: { type: number }
        rss_bytes: { type: integer, format: int64 }
        threads: { type: integer }
        started: { type: string, format: date-time }
        protected:
          type: boolean
          description: The guest's init or its agent, which cannot be stopped from here.

    SignalProcess:
      type: object
      required: [signal]
      properties:
        signal:
          type: string
          enum: [TERM, KILL]

    LoginKey:
      type: object
      required: [id, name, public_key, fingerprint, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        public_key: { type: string }
        fingerprint: { type: string }
        created_at: { type: string, format: date-time }

    AddLoginKey:
      type: object
      required: [public_key]
      properties:
        name:
          type: string
          description: Absent takes the key's own comment.
        public_key:
          type: string
          description: In authorized_keys form, as in ~/.ssh/id_ed25519.pub.

    AccessToken:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    NewAccessToken:
      type: object
      required: [token, info]
      properties:
        token:
          type: string
          description: The token itself, shown this once.
        info: { $ref: "#/components/schemas/AccessToken" }

    CreateToken:
      type: object
      required: [name]
      properties:
        name: { type: string }
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: Absent never expires.

    Profile:
      type: object
      required: [keys, login_keys, secrets]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/SSHKey" }
        login_keys:
          type: array
          description: Public keys that sign the user in to their environments over SSH.
          items: { $ref: "#/components/schemas/LoginKey" }
        secrets:
          type: boolean
          description: >-
            Whether the server can keep SSH keys: without its key, they are
            refused.

    PackPath:
      type: object
      required: [path, sensitive]
      additionalProperties: false
      properties:
        path:
          type: string
          description: >-
            ~/ in the home directory, or absolute. One ending in a slash is a
            directory and everything under it; one starting with ! is left
            out of a directory the pack shares, each environment's own.
        sensitive:
          type: boolean
          description: >-
            Every file under it, in every copy, is kept from environments
            given no sensitive files.

    PackAttach:
      type: string
      description: >-
        The environments a pack reaches without a template listing it: none
        (listed), its owner's, its team's members', or everyone's (an
        administrator's to set).
      enum: [listed, owner, team, everyone]

    Pack:
      type: object
      required: [id, name, description, builtin, attach, paths, can_change, can_delete, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        owner_id: { type: string }
        owner: { type: string, description: The owner's username. }
        team_id: { type: string }
        team: { type: string, description: The owning team's slug. }
        builtin:
          type: boolean
          description: The server's, which administrators change.
        attach: { $ref: "#/components/schemas/PackAttach" }
        paths:
          type: array
          items: { $ref: "#/components/schemas/PackPath" }
        default_copy_id:
          type: string
          description: The copy the user chose to use by default, if they chose one; else their own.
        can_change: { type: boolean }
        can_delete: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PackInput:
      type: object
      required: [name, paths]
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        team_id:
          type: string
          description: Only when making one; the user's own without.
        attach: { $ref: "#/components/schemas/PackAttach" }
        paths:
          type: array
          items: { $ref: "#/components/schemas/PackPath" }

    Copy:
      type: object
      required: [id, pack_id, personal, name, can_write, can_delete, created_at]
      properties:
        id: { type: string }
        pack_id: { type: string }
        owner_id: { type: string }
        owner: { type: string }
        team_id: { type: string }
        team: { type: string }
        personal:
          type: boolean
          description: A person's own copy, one each.
        name: { type: string }
        can_write: { type: boolean }
        can_delete: { type: boolean }
        created_at: { type: string, format: date-time }

    CopyInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string }
        team_id: { type: string }

    CopyName:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string }

    CopyChoice:
      type: object
      additionalProperties: false
      properties:
        copy_id:
          type: string
          description: The copy; without one, the rules choose.

    CopyFiles:
      type: object
      required: [copy, pack, files]
      properties:
        copy: { $ref: "#/components/schemas/Copy" }
        pack: { $ref: "#/components/schemas/Pack" }
        files:
          type: array
          items: { $ref: "#/components/schemas/PackFile" }

    PackFile:
      type: object
      required: [path, size, mode, sensitive, shared, updated_at]
      properties:
        path: { type: string }
        size: { type: integer }
        mode: { type: integer }
        sensitive:
          type: boolean
          description: Under a sensitive path of the pack.
        shared:
          type: boolean
          description: >-
            Under a path the pack shares. A copy keeps a file the pack stopped
            sharing until someone deletes it.
        updated_at: { type: string, format: date-time }

    PackFileMode:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          type: integer
          minimum: 1
          maximum: 511
          description: Its permissions, as chmod takes them (0o600 is 384).

    PackFileContent:
      type: object
      required: [path, content, mode, sensitive, shared, updated_at]
      properties:
        path: { type: string }
        content: { type: string }
        mode: { type: integer }
        sensitive: { type: boolean }
        shared: { type: boolean }
        updated_at: { type: string, format: date-time }

    PutPackFile:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content: { type: string }
        mode:
          type: integer
          minimum: 1
          maximum: 511
          description: >-
            Its permissions; without, the file's own, or 0600 for a sensitive
            one and 0644 for another.

    AttachedPack:
      type: object
      required: [pack, copy, from, listed]
      properties:
        pack: { $ref: "#/components/schemas/Pack" }
        copy: { $ref: "#/components/schemas/Copy" }
        from:
          type: string
          description: >-
            How the copy was chosen: on the environment, the template's pin,
            the one it was first given (kept), or its owner's default.
          enum: [environment, template, kept, default]
        listed:
          type: boolean
          description: Its template lists it, rather than its attaching itself.

    FileConflict:
      type: object
      required: [copy_id, path, found_at]
      properties:
        copy_id: { type: string }
        path: { type: string }
        found_at: { type: string, format: date-time }
        resolution:
          type: string
          description: How someone resolved it, until the environment's agent has done it.
          enum: [shared, environment]

    ResolveConflict:
      type: object
      required: [copy_id, path, resolution]
      additionalProperties: false
      properties:
        copy_id: { type: string }
        path: { type: string }
        resolution:
          type: string
          enum: [shared, environment]

    SSHKey:
      type: object
      required: [id, name, public_key, fingerprint, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        public_key:
          type: string
          description: In authorized_keys form, to add to GitHub and the like.
        fingerprint: { type: string }
        created_at: { type: string, format: date-time }

    AddSSHKey:
      type: object
      required: [name]
      properties:
        name: { type: string }
        private_key:
          type: string
          description: A private key to import. Absent generates an ed25519 key.

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    DesiredState:
      type: string
      description: What the environment's owner has asked for.
      enum: [running, stopped, suspended, deleted]

    Phase:
      type: string
      description: >-
        What the environment is doing, as its worker last reported.
        "pending" means no worker has reported on it yet.
      enum: [pending, starting, running, stopping, stopped, suspending, suspended, failed, deleting]

    Environment:
      type: object
      required: [id, short_id, owner_id, owner, name, template, spec, image, cpus, memory_mib, desired, phase, created_at, updated_at]
      properties:
        id: { type: string }
        short_id:
          type: string
          description: >-
            Names the environment's hosts: code<short_id> for its editor, and
            <name>-env<short_id> for its web servers.
        owner_id: { type: string }
        owner:
          type: string
          description: The owner's username.
        name:
          type: string
          description: Unique among its owner's environments.
        template_id:
          type: string
          description: The template it was made from. Absent once that template is deleted.
        template:
          type: string
          description: That template's name when the environment was made.
        template_changes:
          type: array
          description: >-
            The settings in which it differs from its template's current
            settings.
          items: { $ref: "#/components/schemas/TemplateSetting" }
        template_updated:
          type: boolean
          description: >-
            Whether the template has changed since the environment took its
            copy of it, rather than the environment having been changed.
        ports_public:
          type: boolean
          description: >-
            Whether anyone may reach the environment's own web servers without
            signing in to Hangar.
        image_update: { $ref: "#/components/schemas/ImageUpdate" }
        image_rollback: { $ref: "#/components/schemas/ImageRollback" }
        image_change:
          type: string
          enum: [upgrade, rollback]
          description: What the environment's next start does to its image.
        spec:
          $ref: "#/components/schemas/Spec"
        image: { type: string }
        gpu_renderer:
          type: string
          description: What its virtual GPU renders with on its worker; absent without one.
        gpu_software:
          type: boolean
          description: Whether that is the worker's CPU.
        image_digest:
          type: string
          description: >-
            The digest of the copy of the image the environment boots from,
            fixed when it first starts. Absent until then.
        cpus: { type: integer }
        memory_mib: { type: integer }
        desired: { $ref: "#/components/schemas/DesiredState" }
        phase: { $ref: "#/components/schemas/Phase" }
        reason:
          type: string
          description: Why the environment is in its phase, when there is more to say.
        progress:
          $ref: "#/components/schemas/StartProgress"
        worker_id:
          type: string
          description: The worker it is placed on. Absent until placed.
        worker:
          type: string
          description: That worker's name.
        worker_online:
          type: boolean
          description: >-
            Whether the worker it is placed on has reported in the last 45
            seconds. While it has not, phase is what it last reported, which
            may no longer be so: a worker that stopped or lost its connection
            leaves its environments as they were said to be.
        stats:
          $ref: "#/components/schemas/EnvironmentStats"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateEnvironment:
      type: object
      required: [template_id, name]
      additionalProperties: false
      properties:
        template_id: { type: string }
        name:
          type: string
          description: >-
            A DNS label in either case, since it becomes the hostname in lower
            case, and whatever else the template's name pattern demands.
            Branch names made from it keep its case.
          pattern: "^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$"

    Display:
      type: string
      description: Whether the environment has a graphical desktop.
      enum: [none, desktop]

    TemplateSetting:
      type: string
      description: A setting an environment takes from its template.
      enum: [image, cpus, memory, display, gpu, dax, repos, editor_path, access, trusted_folders, web_names, packs, placement, name]
      x-enum-varnames: [SettingImage, SettingCPUs, SettingMemory, SettingDisplay, SettingGPU, SettingDAX, SettingRepos,
        SettingEditorPath, SettingAccess, SettingTrustedFolders, SettingWebNames, SettingPacks, SettingPlacement,
        SettingName]

    EnvironmentLogName:
      type: string
      description: >-
        console is the guest's serial console, kernel and systemd; worker
        what the worker logged about the environment; monitor Cloud
        Hypervisor's; fs the backend serving the image; gpu the virtual
        GPU's backend.
      enum: [console, worker, monitor, fs, gpu]

    LogPart:
      type: object
      required: [start, next, size, text]
      properties:
        start:
          type: integer
          format: int64
          description: Where in the log the text begins. The oldest of a long log may be gone.
        next:
          type: integer
          format: int64
          description: The offset to ask for next, to read on from here.
        size:
          type: integer
          format: int64
          description: How long the log is so far.
        text: { type: string }
        missing:
          type: boolean
          description: There is no such log yet, such as for a machine not started, or without a GPU.

    ImageUpdate:
      type: object
      description: >-
        A newer copy of the environment's image its worker holds, and what
        upgrading to it would hide: files the environment has changed that
        the newer copy also changes keep the environment's version.
      required: [digest, checked]
      properties:
        digest: { type: string }
        checked:
          type: boolean
          description: Whether its writable disk has been compared with the newer copy, which happens while it is stopped.
        conflicts:
          type: array
          items: { type: string }
        more_conflicts: { type: integer }
        packages:
          type: boolean
          description: The package manager's database is among them.
        error: { type: string }

    ImageRollback:
      type: object
      description: The copy of the writable disk kept from before the last upgrade.
      required: [digest, at, size_bytes]
      properties:
        digest: { type: string }
        at: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64 }

    ImageUpgrade:
      type: object
      additionalProperties: false
      properties:
        force:
          type: boolean
          description: Upgrade even though files the environment has changed would hide the newer image's.

    EnvironmentSettings:
      type: object
      required: [cpus, memory_mib, display, gpu]
      additionalProperties: false
      properties:
        cpus: { type: integer, minimum: 1 }
        memory_mib: { type: integer, minimum: 1 }
        display: { $ref: "#/components/schemas/Display" }
        gpu: { $ref: "#/components/schemas/GPU" }
        dax:
          type: boolean
          description: Map the image's files from the host's page cache rather than read them into the environment's memory.

    GPU:
      type: string
      description: >-
        virtual renders through a GPU shared with other environments;
        passthrough gives the environment a whole physical GPU.
      enum: [none, virtual, passthrough]

    Repo:
      type: object
      required: [url, path]
      additionalProperties: false
      properties:
        url: { type: string, minLength: 1 }
        ref:
          type: string
          description: >-
            Branch, tag or commit to check out. Empty for the default branch.
            In a template it may use variables, as branch does.
        path:
          type: string
          description: >-
            Where in the environment to clone it. Absolute. In a template it
            may use variables, as branch does.
        branch:
          type: string
          description: >-
            A new branch to create after cloning. In a template it may use
            variables, filled in as each environment is made: {name},
            {owner}, {short_id}, {template}, and each named group of the name
            pattern, such as {ticket} from (?P<ticket>[A-Z]+-[0-9]+); a
            group the name leaves out is empty. {variable:lower} and
            {variable:upper} change the case.

    Access:
      type: object
      additionalProperties: false
      description: >-
        What of its owner's the environment is kept from, for code they do
        not trust. Each is false, giving it everything, when left out.
      properties:
        no_self_attached:
          type: boolean
          description: >-
            Only the packs the template lists: none of those attaching
            themselves to environments, the profile among them.
        no_sensitive_files:
          type: boolean
          description: >-
            None of the sensitive files -- credentials, such as Claude's
            sign-in -- of the environment's packs.
        no_ssh_keys:
          type: boolean
          description: No signatures from the owner's SSH keys.
        no_registry:
          type: boolean
          description: No credential for Hangar's registry.
        no_editor_trust:
          type: boolean
          description: VS Code trusts no folder without asking.

    PackRef:
      type: object
      required: [pack]
      additionalProperties: false
      properties:
        pack: { type: string }
        copy:
          type: string
          description: >-
            The copy every environment made from the template uses; without
            one, each owner's own.

    Spec:
      type: object
      required: [image, cpus, memory_mib, display, gpu, repos, placement]
      additionalProperties: false
      properties:
        image: { type: string, minLength: 1 }
        cpus: { type: integer, minimum: 1, maximum: 64 }
        memory_mib: { type: integer, minimum: 512, maximum: 262144 }
        display: { $ref: "#/components/schemas/Display" }
        gpu: { $ref: "#/components/schemas/GPU" }
        repos:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/Repo" }
        editor_path:
          type: string
          description: >-
            The folder the editor opens on. In a template it may use
            variables, as a repository's branch does.
        packs:
          type: array
          maxItems: 16
          description: >-
            The packs the environment has, in order, before those attaching
            themselves to it: a path two of them name is the first's. A pack
            the owner may not use is left out.
          items: { $ref: "#/components/schemas/PackRef" }
        trusted_folders:
          type: array
          description: >-
            Folders VS Code trusts without asking, beyond the repositories and
            the editor's folder, which it trusts anyway. Ignored with
            no_editor_trust, where it trusts nothing.
          items: { type: string }
        access: { $ref: "#/components/schemas/Access" }
        dax:
          type: boolean
          description: >-
            Map the image's files from the host's page cache (DAX) rather than
            read them into the environment's own memory. Their memory is then
            shared with other environments on the image, but programs that run
            from large files, such as a browser, are many times slower on a
            worker under nested virtualisation. A worker with DAX turned off
            (dax_mib 0) reads them in regardless.
        web_names:
          type: array
          maxItems: 16
          description: >-
            Names of the environment's own web servers, such as dashboard,
            which its page links to: each is reached on
            <name>-env<short> after Hangar's host.
          items: { type: string }
        placement:
          type: object
          description: >-
            Worker labels the environment requires: it runs only on a worker
            with every one of these labels, with these values.
          additionalProperties: { type: string }

    Person:
      type: object
      required: [id, username, display_name]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }

    ImageRepository:
      type: object
      required: [id, path, name, description, visibility, collaborators, collaborator_teams, tag_count, can_push, can_manage, created_at, updated_at]
      properties:
        id: { type: string }
        path:
          type: string
          description: <namespace>/<name>, the namespace being its owner's.
        name:
          type: string
          description: The repository's full name, host included, as image references use it.
        description: { type: string }
        visibility: { $ref: "#/components/schemas/Visibility" }
        owner: { $ref: "#/components/schemas/Person" }
        team: { $ref: "#/components/schemas/TeamRef" }
        collaborators:
          type: array
          items: { $ref: "#/components/schemas/Person" }
        collaborator_teams:
          type: array
          items: { $ref: "#/components/schemas/TeamRef" }
        tag_count: { type: integer }
        tags:
          type: array
          description: Given by getImageRepository and the calls that change one, newest first.
          items: { $ref: "#/components/schemas/ImageTag" }
        can_push:
          type: boolean
          description: Whether the caller may push to it, delete its tags and choose its collaborators.
        can_manage:
          type: boolean
          description: Whether the caller may also change who may pull it, or delete it.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ImageTag:
      type: object
      required: [name, digest, media_type, size_bytes, updated_at]
      properties:
        name: { type: string }
        digest: { type: string }
        media_type: { type: string }
        size_bytes:
          type: integer
          format: int64
          description: The image's config and layers, compressed; for an index, its largest image.
        updated_at: { type: string, format: date-time }

    ImageRepositoryInput:
      type: object
      required: [visibility]
      additionalProperties: false
      properties:
        visibility: { $ref: "#/components/schemas/Visibility" }
        description: { type: string, maxLength: 2000 }

    TeamRef:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }

    TeamRole:
      type: string
      description: >-
        viewer: sees and uses what the team owns. member: also changes it.
        admin: also runs the team and deletes what it owns.
      enum: [viewer, member, admin]

    TeamMember:
      type: object
      required: [person, role]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        role: { $ref: "#/components/schemas/TeamRole" }

    Team:
      type: object
      required: [id, slug, name, description, member_count, templates, can_manage, created_at]
      properties:
        id: { type: string }
        slug:
          type: string
          description: The team's name in paths. It does not change.
        name: { type: string }
        description: { type: string }
        member_count: { type: integer }
        members:
          type: array
          description: Given by getTeam and the calls that change a team.
          items: { $ref: "#/components/schemas/TeamMember" }
        templates:
          type: integer
          description: How many templates the team owns.
        role: { $ref: "#/components/schemas/TeamRole" }
        can_manage:
          type: boolean
          description: Whether the caller may change the team and its members.
        created_at: { type: string, format: date-time }

    CreateTeam:
      type: object
      required: [slug, name]
      additionalProperties: false
      properties:
        slug: { type: string, minLength: 1, maxLength: 63 }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }

    TeamInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }

    TeamMembership:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/TeamRole" }

    Template:
      type: object
      description: >-
        owner is the user who made the template or took it on; team, when
        present, is the team that owns it instead.
      required: [id, name, description, visibility, owner, collaborators, collaborator_teams, spec, environments, can_edit, can_manage, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        visibility: { $ref: "#/components/schemas/Visibility" }
        owner: { $ref: "#/components/schemas/Person" }
        team: { $ref: "#/components/schemas/TeamRef" }
        collaborators:
          type: array
          items: { $ref: "#/components/schemas/Person" }
        collaborator_teams:
          type: array
          description: >-
            Teams whose viewers use the template and whose members and admins
            edit it.
          items: { $ref: "#/components/schemas/TeamRef" }
        spec: { $ref: "#/components/schemas/Spec" }
        name_pattern:
          type: string
          description: >-
            A regular expression an environment's whole name must match, such
            as a ticket ID.
        name_hint:
          type: string
          description: What name the pattern wants, in words.
        environments:
          type: integer
          description: How many environments made from it exist.
        can_edit:
          type: boolean
          description: Whether the caller may change the recipe and its collaborators.
        can_manage:
          type: boolean
          description: Whether the caller may also change its visibility, or delete it.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Visibility:
      type: string
      description: >-
        private: the owner and collaborators see it. shared: everyone does.
      enum: [private, shared]

    TemplateInput:
      type: object
      required: [name, visibility, spec]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        visibility: { $ref: "#/components/schemas/Visibility" }
        spec: { $ref: "#/components/schemas/Spec" }
        name_pattern: { type: string, maxLength: 500 }
        name_hint: { type: string, maxLength: 200 }
        team_id:
          type: string
          description: >-
            The team to own the template, one the caller is a member or admin
            of; empty for the caller. Absent leaves an existing template's
            owner as it is.

    Collaborators:
      type: object
      required: [user_ids]
      additionalProperties: false
      properties:
        user_ids:
          type: array
          maxItems: 100
          items: { type: string }
        team_ids:
          type: array
          maxItems: 100
          items: { type: string }

    Resources:
      type: object
      required: [cpus, memory_mib]
      properties:
        cpus: { type: integer }
        memory_mib: { type: integer }

    Worker:
      type: object
      required: [id, name, labels, capacity, allocated, online, revoked, unknown, created_at, images, pending_removals]
      properties:
        id: { type: string }
        name: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        capacity: { $ref: "#/components/schemas/Resources" }
        allocated:
          $ref: "#/components/schemas/Resources"
        online: { type: boolean }
        revoked: { type: boolean }
        unknown:
          type: array
          description: >-
            Environments the worker is running that the server has no record
            of. Reported, never stopped automatically.
          items: { type: string }
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        stats:
          $ref: "#/components/schemas/WorkerStats"
        images:
          type: array
          items: { $ref: "#/components/schemas/LocalImage" }
        gpu: { $ref: "#/components/schemas/GPUInfo" }
        pending_removals:
          type: array
          description: Copies of images the worker has been asked to delete and still holds.
          items:
            $ref: "#/components/schemas/ImageCopy"

    WorkerStats:
      type: object
      description: The worker's machine as a whole, as last measured.
      required: [cpu_percent, support_cpus, gpu_cpus, load1, memory_used_mib, memory_total_mib, disk_used_bytes, disk_total_bytes]
      properties:
        cpu_percent: { type: number }
        support_cpus:
          type: number
          description: >-
            Host cores its environments' support processes use -- their GPU
            backends, file systems and networks -- beside their vCPUs.
        gpu_cpus:
          type: number
          description: The GPU backends' part of support_cpus, where software rendering runs.
        load1: { type: number }
        memory_used_mib: { type: integer }
        memory_total_mib: { type: integer }
        disk_used_bytes: { type: integer, format: int64 }
        disk_total_bytes: { type: integer, format: int64 }

    StartProgress:
      type: object
      description: >-
        How far a starting environment has got. Steps happen in the order
        of the enum; one with nothing to do is passed over. total, where a
        step can be measured, is in unit: bytes, or a clone's objects.
      required: [step]
      properties:
        step:
          type: string
          enum: [download, unpack, snapshot, disks, boot, network, profile, workspace]
        done: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        unit:
          type: string
          enum: [bytes, objects]
        rate:
          type: number
          description: How fast it is going lately, in unit a second.

    EnvironmentStats:
      type: object
      description: >-
        What a running environment uses, as its worker last measured it.
        Rates are per second.
      required: [cpu_percent, support_cpus, gpu_cpus, memory_used_mib, memory_total_mib, disk_used_bytes, disk_read_bps, disk_write_bps, net_rx_bps, net_tx_bps]
      properties:
        support_cpus:
          type: number
          description: >-
            Host cores the processes serving it beside its vCPUs use: its GPU
            backend, file system and network. No vCPU limit holds them.
        gpu_cpus:
          type: number
          description: The GPU backend's part of support_cpus, where software rendering runs.
        cpu_percent:
          type: number
          description: Of the environment's own vCPUs; 100 is all of them busy.
        memory_used_mib: { type: integer }
        memory_total_mib: { type: integer }
        disk_used_bytes:
          type: integer
          format: int64
          description: What its writable layer and Docker store take on the worker.
        disk_read_bps: { type: number }
        disk_write_bps: { type: number }
        net_rx_bps: { type: number }
        net_tx_bps: { type: number }

    GPUInfo:
      type: object
      description: What a worker's virtual GPUs render with, as it found when it started.
      required: [renderer]
      properties:
        renderer:
          type: string
          description: What its configuration asks for.
          enum: [auto, hardware, software]
        device: { type: string }
        gl: { $ref: "#/components/schemas/GPURenderer" }
        gl_error: { type: string }
        vulkan:
          type: array
          items: { $ref: "#/components/schemas/GPUDevice" }
        vulkan_error: { type: string }
        unavailable:
          type: string
          description: Why the worker offers no virtual GPU, when it offers none.

    GPURenderer:
      type: object
      required: [vendor, renderer, version, software]
      properties:
        vendor: { type: string }
        renderer: { type: string }
        version: { type: string }
        software:
          type: boolean
          description: Whether it renders on the host's CPU.

    GPUDevice:
      type: object
      required: [name, software]
      properties:
        name: { type: string }
        software: { type: boolean }

    LocalImage:
      type: object
      required: [ref, digest, size_bytes, state, environments, current]
      properties:
        ref: { type: string }
        digest:
          type: string
          description: >-
            What the reference named when the copy was taken: the manifest's
            digest for a pulled image, "build:" and the build's ID for a copy
            of a local build.
        current:
          type: boolean
          description: >-
            Whether the copy is what the reference names, as the worker last
            looked. New environments are made from the current copy; older
            ones stay for the environments made from them.
        size_bytes: { type: integer, format: int64 }
        state:
          type: string
          enum: [ready, fetching]
        environments:
          type: array
          description: IDs of the environments on the worker using it.
          items: { type: string }

    TerminalSession:
      type: object
      required: [id, title, created_at, clients, cols, rows]
      properties:
        id: { type: string }
        title:
          type: string
          description: What the shell or the program in it last set as the window title.
        created_at: { type: string, format: date-time }
        clients:
          type: integer
          description: How many windows are attached to it.
        cols: { type: integer }
        rows: { type: integer }

    DesktopSize:
      type: object
      required: [width, height]
      additionalProperties: false
      properties:
        width: { type: integer, minimum: 1, maximum: 100000 }
        height: { type: integer, minimum: 1, maximum: 100000 }

    EditorURL:
      type: object
      required: [url]
      properties:
        url: { type: string }

    ImageCopy:
      type: object
      description: One copy of an image in a worker's store.
      required: [ref, digest]
      additionalProperties: false
      properties:
        ref: { type: string, minLength: 1 }
        digest: { type: string }

    Login:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }

    Me:
      type: object
      required: [id, username, display_name, admin, has_password]
      properties:
        registry:
          type: string
          description: >-
            The host of Hangar's own registry, which image names on it start
            with. Absent when the server runs none.
        environment_host_suffix:
          type: string
          description: >-
            What follows env<short> in the host an environment's own web servers
            are reached on, such as .hangar.example.com: any name and a hyphen
            may go before it. Absent when the server has no public URL.
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        admin: { type: boolean }
        has_password:
          type: boolean
          description: Whether the user has a local password that they can change.
        ssh:
          $ref: "#/components/schemas/SSHGateway"

    SSHGateway:
      type: object
      description: >-
        Where the SSH gateway is reached: ssh <environment>@<host> -p <port>,
        with a sign-in key. Absent when the server runs none.
      required: [host, port, host_key]
      properties:
        host: { type: string }
        port: { type: integer }
        host_key:
          type: string
          description: >-
            The gateway's public host key, in known_hosts form without the
            host name, for clients to trust without asking.

    ChangePassword:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8 }

    User:
      type: object
      required: [id, username, display_name, admin, disabled, has_password, environments, created_at]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        admin: { type: boolean }
        disabled:
          type: boolean
          description: A disabled user cannot sign in. Their environments are kept.
        has_password: { type: boolean }
        environments:
          type: integer
          description: How many environments the user owns.
        created_at: { type: string, format: date-time }

    CreateUser:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._@-]{0,62}$"
        display_name: { type: string, maxLength: 200 }
        password: { type: string, minLength: 8 }
        admin: { type: boolean }

    UpdateUser:
      type: object
      additionalProperties: false
      description: Only the fields present are changed.
      properties:
        display_name: { type: string, maxLength: 200 }
        admin: { type: boolean }
        disabled: { type: boolean }
        password: { type: string, minLength: 8 }
