openapi: 3.0.3
info:
  title: Hangar client API
  version: "1"
  description: >-
    The API for clients that ship apart from the server: the desktop app,
    scripts. It is small on purpose, and stable.


    Compatibility. Within v1 a change only adds: a new endpoint, a new
    optional field in a request, a new field in a response, a new value
    where a field's description says more may come. A client ignores
    fields it does not know, and treats an enum value it does not know as
    the description says. Anything else -- removing or renaming a field,
    changing its meaning or type, requiring more of a request -- is a new
    version, /api/v2, served beside v1 for as long as the server lists v1
    in /api/v1/version.


    Terminals. GET /api/v1/environments/{id}/terminal is a WebSocket attached
    to one of the environment's terminal sessions: ?session= names one (the
    terminals list gives them), or a new one starts, in ?dir= if given, at
    ?cols= and ?rows=. The first message from the server is the attach's
    reply as JSON text: {"session": {"id", "title", "created", "clients",
    "cols", "rows"}, "history": N, "owner": bool}, or {"err": "..."}. After it every message is binary, one frame
    each: a type byte, then its payload. From the server: 'o' what the shell
    wrote (the first "history" bytes of it are recent output replayed,
    which a terminal must not answer), 's' the size (columns, rows and
    attached clients as big-endian 16-bit numbers, then 1 if this connection
    holds the size), 'x' the shell exited (its status, 4 bytes), last. To
    the server: 'i' keys and pastes, 'r' take the size (columns then rows,
    16-bit), 'p' the size this window would have, used while it holds the
    size. The text "ping" is answered "pong". It is refused with 409 for an
    environment not running and 503 when its worker cannot be reached.


    Code. GET /api/v1/environments/{id}/code is a WebSocket to the
    environment's Code service, in ?root= (an absolute folder) or its
    editor folder: each binary message is one of the service's frames, a
    channel byte then its payload; 'r' carries JSON requests ({"id",
    "method", "params"}), their replies ({"id", "result"} or {"id",
    "error"}) and events ({"event", "params"}). The service's own
    documentation (crates/agent) says what each method does. It is refused
    as the terminal is.


    Desktop. GET /api/v1/environments/{id}/desktop is a WebSocket to the
    environment's Linux desktop's VNC server: every binary message is RFB
    bytes, as they are, both ways, and the server reads none of them. The
    VNC server asks no password: reaching the socket is the permission. A
    socket the desktop closes before sending anything means there is no
    desktop to serve. POST .../desktop/size sets the desktop's size. It is
    refused as the terminal is, and with 409 for an environment that has no
    desktop.


    A client asks /api/v1/version first. It needs no sign-in, and says which
    versions the server serves and which build it is, so a client can tell
    "this server is too old for me" from "I am too old for this server".


    Sign in with an access token (Authorization: Bearer hgr_...) or the web
    UI's session cookie. A request that changes something and carries the
    cookie must come from the server's own origin, or from no browser page
    at all.

servers:
  - url: /api/v1

security:
  - token: []
  - session: []

paths:
  /version:
    get:
      operationId: getVersion
      summary: Which versions of this API the server serves, and its build
      security: []
      responses:
        "200":
          description: The server's versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }

  /me:
    get:
      operationId: getMe
      summary: The signed-in user, and how to reach their environments over SSH
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/login-keys:
    get:
      operationId: listLoginKeys
      summary: The public keys that sign the user in over SSH
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LoginKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: addLoginKey
      summary: Add a public key that signs the user in over SSH
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddLoginKey" }
      responses:
        "201":
          description: The key was added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginKey" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /environments:
    get:
      operationId: listEnvironments
      summary: Every environment the user can reach, oldest first
      responses:
        "200":
          description: The environments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /environments/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getEnvironment
      summary: One environment
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteEnvironment
      summary: Delete an environment and its disks
      description: >-
        One that is running is asked to stop and goes once it has, and is
        answered as it stands; one already stopped goes at once, answered
        with no content.
      responses:
        "200": { $ref: "#/components/responses/Environment" }
        "204":
          description: The environment is gone.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{id}/reset:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: resetEnvironment
      summary: Give a stopped environment its template's current settings
      description: >-
        Its disks and everything on them are kept. Refused when the template
        names another image or other repositories, or placement its worker
        does not meet.
      responses:
        "200": { $ref: "#/components/responses/Environment" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /environments/{id}/start:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: startEnvironment
      summary: Ask for an environment to run
      responses:
        "200": { $ref: "#/components/responses/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /environments/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: stopEnvironment
      summary: Ask for an environment to stop, keeping its disks
      responses:
        "200": { $ref: "#/components/responses/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /environments/{id}/suspend:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: suspendEnvironment
      summary: Ask for an environment to suspend, keeping its memory on disk
      responses:
        "200": { $ref: "#/components/responses/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /environments/{id}/ports:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: setEnvironmentPorts
      summary: Say who may reach the environment's own web servers
      description: >-
        Public: anyone, without signing in to Hangar, on its
        <anything>-env<short> hosts. Private: only those who may reach the
        environment. A port reached by its number is always private.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public]
              additionalProperties: false
              properties:
                public: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{id}/task:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: setTask
      summary: Set what an environment is for, ending its task before
      description: >-
        The text is kept on one line, its spaces collapsed, and has 1 to 200
        characters. The same text as the environment's task is that task.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetTask" }
      responses:
        "200":
          description: The environment's task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: endTask
      summary: Mark an environment's task done, leaving it none
      responses:
        "204": { description: The task is done, or there was none. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{id}/tasks:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listTasks
      summary: An environment's tasks, newest first, its task among them
      responses:
        "200":
          description: The tasks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{id}/agents/{session}/seen:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: session
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: seeAgent
      summary: Say the user has looked at an agent's session
      description: >-
        A client says so when the session is in front of the user: its
        terminal visible in a focused window. A session that asked or
        finished before then stops needing them.
      responses:
        "204": { description: Recorded. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{id}/terminals:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listTerminals
      summary: The environment's terminal sessions
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TerminalSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /environments/{id}/terminals/{session}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: session
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: closeTerminal
      summary: End a terminal session, ending what runs in it
      responses:
        "204": { description: Ended. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /environments/{id}/logs/{log}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: log
        in: path
        required: true
        schema: { $ref: "#/components/schemas/EnvironmentLogName" }
    get:
      operationId: getEnvironmentLog
      summary: Part of one of the environment's logs, from its worker
      description: >-
        What follows offset, or with no offset the end. Its worker keeps
        each log from the environment's last start, whatever it is doing
        since, so a start that failed can be looked into.
      parameters:
        - name: offset
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Part of the log.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogPart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /environments/{id}/desktop/size:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: resizeDesktop
      summary: Sets the size of the environment's desktop
      description: >-
        Its output's mode, in pixels, as a viewer fitting it to its window
        asks: every viewer sees the one desktop, so the last to ask wins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [width, height]
              properties:
                width: { type: integer }
                height: { type: integer }
      responses:
        "204": { description: Resized. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /environments/{id}/processes:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listProcesses
      summary: The processes running in the environment
      description: >-
        Every process in the guest, as its agent reads them from /proc, with
        how many CPUs and how much memory the guest has. Asked of the
        environment each time, so a client polls it while it shows it.
      responses:
        "200":
          description: The processes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /environments/{id}/processes/{pid}/signal:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: pid
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: signalProcess
      summary: Stops a process, asking it (TERM) or forcing it (KILL)
      description: >-
        The guest's init and its agent cannot be signalled (a process list
        marks them protected); asking is 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signal]
              properties:
                signal:
                  type: string
                  enum: [TERM, KILL]
      responses:
        "204": { description: Signalled. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /environments/{id}/activity:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listActivity
      summary: What has been done to the environment, newest first
      description: >-
        The audit log's events about the environment the user may see:
        who did what, and the change it made. A page at a time, before
        the id of the last one read.
      parameters:
        - name: before
          in: query
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: The events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events:
    get:
      operationId: streamEvents
      summary: Changes to the environments the user can reach, as they happen
      description: >-
        Server-sent events. The stream starts with an environment event for
        each environment the user can reach, then a synced event; after that
        each change to one is an environment event with all of it, and an
        environment deleted, or out of the user's reach, is a removed event.
        Changes close together may arrive as one. A comment line is sent
        every 30 seconds when nothing else is. A client that loses the
        stream opens it again, and is sent everything again. More event
        types may come; ignore one you do not know.


        event: environment, data: an Environment.
        event: removed, data: {"id": "..."}.
        event: synced, data: {}.
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
    session:
      type: apiKey
      in: cookie
      name: hangar_session

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    Environment:
      description: The environment, as it is after the request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Environment" }
    Unauthorized:
      description: Not signed in.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such thing, or not one the user can reach.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Not possible in the state it is in.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: The environment's worker cannot be reached from this server just now.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: The request is not valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Version:
      type: object
      required: [versions, server]
      properties:
        versions:
          type: array
          description: >-
            The API versions this server serves, oldest first: "v1", and in
            time more. A client uses the newest it knows.
          items: { type: string }
        server:
          type: string
          description: The server's build, for display.

    Me:
      type: object
      required: [id, username, display_name, admin]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        admin: { type: boolean }
        ssh: { $ref: "#/components/schemas/SSHGateway" }
        environment_host_suffix:
          type: string
          description: >-
            What follows env<short> in the host an environment's own web
            servers are reached on, such as .hangar.example.com: a name and a
            hyphen before it reach a server by that name on port 80, a number
            that port. Absent when the server has no public URL.

    SSHGateway:
      type: object
      description: >-
        Where the SSH gateway is: ssh <environment>@<host> -p <port>, or
        <owner>/<environment> for someone else's. Absent when the server runs
        none.
      required: [host, port, host_key]
      properties:
        host: { type: string }
        port: { type: integer }
        host_key:
          type: string
          description: The gateway's public host key, in known_hosts form without the host name.

    LoginKey:
      type: object
      required: [id, name, fingerprint, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        fingerprint:
          type: string
          description: SHA256:..., as ssh-keygen -l prints it.
        created_at: { type: string, format: date-time }

    AddLoginKey:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string
          description: In authorized_keys form, as in ~/.ssh/id_ed25519.pub.
        name:
          type: string
          description: Absent takes the key's own comment.

    Environment:
      type: object
      required: [id, short_id, name, owner_id, owner, template, phase, desired, created_at, updated_at]
      properties:
        id: { type: string }
        short_id:
          type: string
          description: >-
            Six characters that name the environment on the whole server:
            the SSH gateway takes it as the username, as <short_id>@<host>,
            whoever owns the environment.
        name: { type: string }
        owner_id: { type: string }
        owner:
          type: string
          description: The owner's username.
        template: { type: string }
        phase:
          type: string
          description: >-
            What it is doing, as its worker last reported: pending, starting,
            running, stopping, stopped, suspending, suspended, failed,
            deleting. More may come; treat one you do not know as busy.
        desired:
          type: string
          description: What its owner asked for -- running, stopped, suspended or deleted. More may come.
        reason:
          type: string
          description: Why it is in its phase, when there is more to say.
        progress: { $ref: "#/components/schemas/StartProgress" }
        worker:
          type: string
          description: The worker it runs on, once placed.
        worker_online:
          type: boolean
          description: >-
            Whether the worker it is placed on has reported in the last 45
            seconds. While it has not, phase is what it last reported, which
            may no longer be so: a worker that stopped or lost its connection
            leaves its environments as they were said to be.
        editor_path:
          type: string
          description: >-
            The folder an editor opens in it: its first project.
        workspace_file:
          type: string
          description: >-
            Where in it a workspace file (.code-workspace) of its projects is,
            when it has more than one, for an editor to open in place of
            editor_path.
        display:
          type: string
          description: Its display -- none or desktop. More may come.
        cpus: { type: integer }
        memory_mib: { type: integer }
        ports_public:
          type: boolean
          description: >-
            Whether anyone may reach its own web servers without signing in
            to Hangar.
        web_names:
          type: array
          description: The names of its own web servers its template lists.
          items: { type: string }
        task: { $ref: "#/components/schemas/Task" }
        stats: { $ref: "#/components/schemas/EnvironmentStats" }
        agents:
          type: array
          description: The coding agents' sessions in it, oldest first.
          items: { $ref: "#/components/schemas/AgentSession" }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: When its phase last changed.

    StartProgress:
      type: object
      description: >-
        How far a start has got: its step -- download, unpack, disks, boot,
        network, profile, workspace, in that order, more may come -- and, where the
        step can be measured, done of total in unit (bytes or objects), at
        rate a second lately.
      required: [step]
      properties:
        step: { type: string }
        done: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        unit: { type: string }
        rate: { type: number }

    Task:
      type: object
      description: >-
        What an environment is for: a line its coding agent sets as it
        works, or its owner does.
      required: [id, text, set_by, set_at]
      properties:
        id: { type: string }
        text: { type: string }
        set_by:
          type: string
          description: Who set it -- agent or user. More may come.
        set_at: { type: string, format: date-time }
        done_at:
          type: string
          format: date-time
          description: When it was done, or replaced by another. Absent for the environment's task.

    SetTask:
      type: object
      required: [text]
      properties:
        text: { type: string }

    AgentSession:
      type: object
      description: >-
        A coding agent's session in an environment, as the agent's hooks
        report it: what it is doing, never prompts, commands or file
        contents.
      required: [id, agent, state, since, needs_you]
      properties:
        id:
          type: string
          description: The agent's own ID for the session.
        agent:
          type: string
          description: Which agent -- claude or codex. More may come.
        terminal:
          type: string
          description: The terminal session it runs in, when it runs in one.
        state:
          type: string
          description: >-
            asking (it wants a decision), finished (its turn ended and the
            user has not looked since), working, idle, or ended (its program
            exited). More may come; treat one you do not know as working.
        step:
          type: string
          description: What a working session is doing, such as "Edit src/main.go".
        message:
          type: string
          description: What an asking session asks, in the agent's words.
        since:
          type: string
          format: date-time
          description: When it took its state.
        needs_you:
          type: boolean
          description: Whether it asks or has finished, and the user has not looked since.

    EnvironmentLogName:
      type: string
      description: >-
        combined is the others as one, each line marked with the log it is
        from, in the order the worker saw them written; console is the
        guest's serial console, kernel and systemd; worker what the worker
        logged about the environment; monitor the virtual machine's
        monitor's; gpu the virtual GPU's backend.
      enum: [combined, console, worker, monitor, gpu]

    EnvironmentStats:
      type: object
      description: >-
        What a running environment is using, as its worker last measured.
      required: [cpu_percent, memory_used_mib, memory_total_mib]
      properties:
        cpu_percent:
          type: number
          description: Of its own vCPUs; 100 is all of them busy.
        memory_used_mib:
          type: integer
          description: What its programs use, as the guest sees it.
        memory_total_mib: { type: integer }
        memory_cached_mib:
          type: integer
          description: Its cache of files, which it would give up for its programs.
        host_memory_mib:
          type: integer
          description: The worker's memory its RAM takes up.
        swap_total_mib: { type: integer }
        swap_used_mib: { type: integer }
        disk_used_bytes: { type: integer, format: int64 }
        disk_read_bps: { type: number }
        disk_write_bps: { type: number }
        net_rx_bps: { type: number }
        net_tx_bps: { type: number }

    ProcessList:
      type: object
      required: [cpus, memory_bytes, processes]
      properties:
        cpus: { type: integer }
        memory_bytes: { type: integer, format: int64 }
        processes:
          type: array
          items: { $ref: "#/components/schemas/Process" }

    Process:
      type: object
      required: [pid, ppid, user, name, command, state, cpu_percent, rss_bytes, threads, started]
      properties:
        pid: { type: integer }
        ppid: { type: integer }
        user: { type: string }
        name: { type: string }
        command: { type: string }
        state:
          type: string
          description: As /proc gives it -- R running, S sleeping, D waiting on I/O, Z a zombie.
        cpu_percent: { type: number }
        rss_bytes: { type: integer, format: int64 }
        threads: { type: integer }
        started: { type: string, format: date-time }
        protected:
          type: boolean
          description: The guest's init or its agent, which cannot be stopped from here.

    ActivityEvent:
      type: object
      required: [id, at, actor, action, target, details]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor:
          type: object
          required: [kind, name]
          properties:
            kind:
              type: string
              description: user, worker or system. More may come.
            id: { type: string }
            name: { type: string }
        action:
          type: string
          description: What was done, as environment.start or environment.phase.
        target:
          type: object
          required: [type, id, name]
          properties:
            type: { type: string }
            id: { type: string }
            name: { type: string }
        details:
          type: object
          additionalProperties: true

    LogPart:
      type: object
      required: [start, next, size, text]
      properties:
        start:
          type: integer
          format: int64
          description: Where in the log the text begins. The oldest of a long log may be gone.
        next:
          type: integer
          format: int64
          description: The offset to ask for next, to read on from here.
        size:
          type: integer
          format: int64
          description: How long the log is so far.
        text: { type: string }
        missing:
          type: boolean
          description: There is no such log yet, such as for a machine not started, or without a GPU.

    TerminalSession:
      type: object
      required: [id, title, created_at, clients, cols, rows]
      properties:
        id:
          type: string
          description: Also what HANGAR_TERMINAL_SESSION says in it, and an agent session's terminal.
        title:
          type: string
          description: What the shell or the program in it last set as the window title.
        created_at: { type: string, format: date-time }
        clients:
          type: integer
          description: How many windows are attached to it.
        cols: { type: integer }
        rows: { type: integer }
