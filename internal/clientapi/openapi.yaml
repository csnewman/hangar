openapi: 3.0.3
info:
  title: Hangar client API
  version: "1"
  description: >-
    The API for clients that ship apart from the server: the desktop app,
    scripts. It is small on purpose, and stable.


    Compatibility. Within v1 a change only adds: a new endpoint, a new
    optional field in a request, a new field in a response, a new value
    where a field's description says more may come. A client ignores
    fields it does not know, and treats an enum value it does not know as
    the description says. Anything else -- removing or renaming a field,
    changing its meaning or type, requiring more of a request -- is a new
    version, /api/v2, served beside v1 for as long as the server lists v1
    in /api/v1/version.


    Terminals. GET /api/v1/environments/{id}/terminal is a WebSocket attached
    to one of the environment's terminal sessions: ?session= names one (the
    terminals list gives them), or a new one starts, in ?dir= if given, at
    ?cols= and ?rows=. The first message from the server is the attach's
    reply as JSON text: {"session": {"id", "title", "created", "clients",
    "cols", "rows"}, "history": N, "owner": bool}, or {"err": "..."}. After it every message is binary, one frame
    each: a type byte, then its payload. From the server: 'o' what the shell
    wrote (the first "history" bytes of it are recent output replayed,
    which a terminal must not answer), 's' the size (columns, rows and
    attached clients as big-endian 16-bit numbers, then 1 if this connection
    holds the size), 'x' the shell exited (its status, 4 bytes), last. To
    the server: 'i' keys and pastes, 'r' take the size (columns then rows,
    16-bit), 'p' the size this window would have, used while it holds the
    size. The text "ping" is answered "pong". It is refused with 409 for an
    environment not running and 503 when its worker cannot be reached.


    Code. GET /api/v1/environments/{id}/code is a WebSocket to the
    environment's Code service, in ?root= (an absolute folder) or its
    editor folder: each binary message is one of the service's frames, a
    channel byte then its payload; 'r' carries JSON requests ({"id",
    "method", "params"}), their replies ({"id", "result"} or {"id",
    "error"}) and events ({"event", "params"}). The service's own
    documentation (crates/agent) says what each method does. It is refused
    as the terminal is.


    Desktop. GET /api/v1/environments/{id}/desktop is a WebSocket to the
    environment's Linux desktop's VNC server: every binary message is RFB
    bytes, as they are, both ways, and the server reads none of them. The
    VNC server asks no password: reaching the socket is the permission. A
    socket the desktop closes before sending anything means there is no
    desktop to serve. POST .../desktop/size sets the desktop's size. It is
    refused as the terminal is, and with 409 for an environment that has no
    desktop.


    A client asks /api/v1/version first. It needs no sign-in, and says which
    versions the server serves and which build it is, so a client can tell
    "this server is too old for me" from "I am too old for this server".


    Sign in with an access token (Authorization: Bearer hgr_...) or the web
    UI's session cookie. A request that changes something and carries the
    cookie must come from the server's own origin, or from no browser page
    at all.

servers:
  - url: /api/v1

security:
  - token: []
  - session: []

paths:
  /version:
    get:
      operationId: getVersion
      summary: Which versions of this API the server serves, and its build
      security: []
      responses:
        "200":
          description: The server's versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }

  /sign-in:
    post:
      operationId: startSignIn
      security: []
      summary: >-
        Begin signing an app in through the browser: the app shows the code,
        opens verification_path on this server, where the person signs in
        and approves it, and collects its token from /sign-in/token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartSignIn" }
      responses:
        "201":
          description: The grant to wait on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInGrant" }
        "400": { $ref: "#/components/responses/Invalid" }

  /sign-in/token:
    post:
      operationId: finishSignIn
      security: []
      summary: >-
        Collect the access token an approved grant makes, once. 202 while it
        waits to be approved: ask again after the grant's interval.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinishSignIn" }
      responses:
        "200":
          description: Approved; the token, shown this once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInToken" }
        "202":
          description: Not yet approved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The person refused it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me:
    get:
      operationId: getMe
      summary: The signed-in user, and how to reach their environments over SSH
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/login-keys:
    get:
      operationId: listLoginKeys
      summary: The public keys that sign the user in over SSH
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LoginKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: addLoginKey
      summary: Add a public key that signs the user in over SSH
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddLoginKey" }
      responses:
        "201":
          description: The key was added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginKey" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/login-keys/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteLoginKey
      summary: Remove a public key that signs the user in over SSH
      responses:
        "204": { description: The key was removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/tokens:
    get:
      operationId: listTokens
      summary: The user's access tokens, the one this request came with marked
      responses:
        "200":
          description: The tokens, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/tokens/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: revokeToken
      summary: End one of the user's access tokens
      responses:
        "204": { description: The token was revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/ssh-keys:
    get:
      operationId: listSSHKeys
      summary: >-
        The SSH keys the server signs with for the user. Their private halves
        never leave the server.
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SSHKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: generateSSHKey
      summary: Make a new SSH key for the user, kept on the server
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateSSHKey" }
      responses:
        "201":
          description: The key was made.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHKey" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/ssh-keys/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteSSHKey
      summary: Remove one of the user's SSH keys
      responses:
        "204": { description: The key was removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments:
    get:
      operationId: listEnvironments
      summary: Every environment the user can reach, oldest first
      responses:
        "200":
          description: The environments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createEnvironment
      summary: Make an environment from a template
      description: It starts once a worker takes it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEnvironment" }
      responses:
        "201":
          description: Made.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /templates:
    get:
      operationId: listTemplates
      summary: The templates the user may make an environment from
      description: >-
        Shared ones, and private ones they own or collaborate on (all of
        them, for an administrator).
      responses:
        "200":
          description: The templates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /environments/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getEnvironment
      summary: One environment
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteEnvironment
      summary: Delete an environment and its disks
      description: >-
        One that is running is asked to stop and goes once it has, and is
        answered as it stands; one already stopped goes at once, answered
        with no content.
      responses:
        "200": { $ref: "#/components/responses/Environment" }
        "204":
          description: The environment is gone.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{id}/reset:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: resetEnvironment
      summary: Give a stopped environment its template's current settings
      description: >-
        Its disks and everything on them are kept. Refused when the template
        names another image or other repositories, or placement its worker
        does not meet.
      responses:
        "200": { $ref: "#/components/responses/Environment" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /environments/{id}/start:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: startEnvironment
      summary: Ask for an environment to run
      responses:
        "200": { $ref: "#/components/responses/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /environments/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: stopEnvironment
      summary: Ask for an environment to stop, keeping its disks
      responses:
        "200": { $ref: "#/components/responses/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /environments/{id}/suspend:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: suspendEnvironment
      summary: Ask for an environment to suspend, keeping its memory on disk
      responses:
        "200": { $ref: "#/components/responses/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /environments/{id}/ports:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: setEnvironmentPorts
      summary: Say who may reach the environment's own web servers
      description: >-
        Public: anyone, without signing in to Hangar, on its
        <anything>-env<short> hosts. Private: only those who may reach the
        environment. A port reached by its number is always private.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public]
              additionalProperties: false
              properties:
                public: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{id}/settings:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: updateEnvironmentSettings
      summary: Change the environment's machine
      description: >-
        A stopped environment's size, display, GPU, image mapping and swap,
        which take effect when it next starts; or a running one's memory
        alone, which its machine is resized to as it runs, between
        stats.machine_memory_min_mib, what its programs use plus 512 MiB, and
        stats.machine_memory_max_mib.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentSettings" }
      responses:
        "200": { $ref: "#/components/responses/Environment" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /environments/{id}/packs:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listEnvironmentPacks
      summary: The packs of shared files the environment has, and the copy of each it uses
      responses:
        "200":
          description: Its packs, in the order a path two of them name goes to the first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EnvironmentPack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{id}/packs/{pack}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: pack
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: chooseEnvironmentCopy
      summary: Choose which copy of a pack the environment uses
      description: >-
        A running environment changes over as it runs. Without copy_id, the
        choice is undone: the template's pin, the one it was first given, or
        its owner's default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                copy_id: { type: string }
      responses:
        "204":
          description: Chosen.
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{id}/image/{change}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: change
        in: path
        required: true
        description: >-
          upgrade moves it to image_update's copy at its next start (at once, if
          it is stopped), its writable disk copied aside first; rollback puts
          that copy back and returns to the copy it had; keep deletes the
          copy kept aside; cancel undoes an upgrade or rollback not yet
          made.
        schema:
          type: string
          enum: [upgrade, rollback, keep, cancel]
    post:
      operationId: changeEnvironmentImage
      summary: Upgrade the environment's image, roll it back, or keep the upgrade
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                force:
                  type: boolean
                  description: Upgrade though image_update's conflicts have not been checked.
      responses:
        "200": { $ref: "#/components/responses/Environment" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /worker-sizes:
    get:
      operationId: listWorkerSizes
      summary: How big an environment may be
      description: >-
        The capacity of each worker online, largest first, without saying
        which is which: how big an environment can be and still find a
        worker that could hold it, whatever each is running.
      responses:
        "200":
          description: The sizes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Resources" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /environments/{id}/task:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: setTask
      summary: Set what an environment is for, ending its task before
      description: >-
        The text is kept on one line, its spaces collapsed, and has 1 to 200
        characters. The same text as the environment's task is that task.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetTask" }
      responses:
        "200":
          description: The environment's task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: endTask
      summary: Mark an environment's task done, leaving it none
      responses:
        "204": { description: The task is done, or there was none. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{id}/tasks:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listTasks
      summary: An environment's tasks, newest first, its task among them
      responses:
        "200":
          description: The tasks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{id}/agents/{session}/seen:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: session
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: seeAgent
      summary: Say the user has looked at an agent's session
      description: >-
        A client says so when the session is in front of the user: its
        terminal visible in a focused window. A session that asked or
        finished before then stops needing them.
      responses:
        "204": { description: Recorded. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{id}/terminals:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listTerminals
      summary: The environment's terminal sessions
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TerminalSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /environments/{id}/terminals/{session}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: session
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: closeTerminal
      summary: End a terminal session, ending what runs in it
      responses:
        "204": { description: Ended. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /environments/{id}/logs/{log}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: log
        in: path
        required: true
        schema: { $ref: "#/components/schemas/EnvironmentLogName" }
    get:
      operationId: getEnvironmentLog
      summary: Part of one of the environment's logs, from its worker
      description: >-
        What follows offset, or with no offset the end. Its worker keeps
        each log from the environment's last start, whatever it is doing
        since, so a start that failed can be looked into.
      parameters:
        - name: offset
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Part of the log.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogPart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /environments/{id}/desktop/size:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: resizeDesktop
      summary: Sets the size of the environment's desktop
      description: >-
        Its output's mode, in pixels, as a viewer fitting it to its window
        asks: every viewer sees the one desktop, so the last to ask wins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [width, height]
              properties:
                width: { type: integer }
                height: { type: integer }
      responses:
        "204": { description: Resized. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /environments/{id}/processes:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listProcesses
      summary: The processes running in the environment
      description: >-
        Every process in the guest, as its agent reads them from /proc, with
        how many CPUs and how much memory the guest has. Asked of the
        environment each time, so a client polls it while it shows it.
      responses:
        "200":
          description: The processes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /environments/{id}/processes/{pid}/signal:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: pid
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: signalProcess
      summary: Stops a process, asking it (TERM) or forcing it (KILL)
      description: >-
        The guest's init and its agent cannot be signalled (a process list
        marks them protected); asking is 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signal]
              properties:
                signal:
                  type: string
                  enum: [TERM, KILL]
      responses:
        "204": { description: Signalled. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /environments/{id}/activity:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listActivity
      summary: What has been done to the environment, newest first
      description: >-
        The audit log's events about the environment the user may see:
        who did what, and the change it made. A page at a time, before
        the id of the last one read.
      parameters:
        - name: before
          in: query
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: The events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events:
    get:
      operationId: streamEvents
      summary: Changes to the environments the user can reach, as they happen
      description: >-
        Server-sent events. The stream starts with an environment event for
        each environment the user can reach, then a synced event; after that
        each change to one is an environment event with all of it, and an
        environment deleted, or out of the user's reach, is a removed event.
        Changes close together may arrive as one. A comment line is sent
        every 30 seconds when nothing else is. A client that loses the
        stream opens it again, and is sent everything again. More event
        types may come; ignore one you do not know.


        event: environment, data: an Environment.
        event: removed, data: {"id": "..."}.
        event: synced, data: {}.
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
    session:
      type: apiKey
      in: cookie
      name: hangar_session

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    Environment:
      description: The environment, as it is after the request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Environment" }
    Forbidden:
      description: Not something the user may do.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not signed in.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such thing, or not one the user can reach.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Not possible in the state it is in.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: The environment's worker cannot be reached from this server just now.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: The request is not valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Version:
      type: object
      required: [versions, server]
      properties:
        versions:
          type: array
          description: >-
            The API versions this server serves, oldest first: "v1", and in
            time more. A client uses the newest it knows.
          items: { type: string }
        server:
          type: string
          description: The server's build, for display.

    Me:
      type: object
      required: [id, username, display_name, admin]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        admin: { type: boolean }
        ssh: { $ref: "#/components/schemas/SSHGateway" }
        environment_host_suffix:
          type: string
          description: >-
            What follows env<short> in the host an environment's own web
            servers are reached on, such as .hangar.example.com: a name and a
            hyphen before it reach a server by that name on port 80, a number
            that port. Absent when the server has no public URL.

    SSHGateway:
      type: object
      description: >-
        Where the SSH gateway is: ssh <environment>@<host> -p <port>, or
        <owner>/<environment> for someone else's. Absent when the server runs
        none.
      required: [host, port, host_key]
      properties:
        host: { type: string }
        port: { type: integer }
        host_key:
          type: string
          description: The gateway's public host key, in known_hosts form without the host name.

    LoginKey:
      type: object
      required: [id, name, fingerprint, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        fingerprint:
          type: string
          description: SHA256:..., as ssh-keygen -l prints it.
        created_at: { type: string, format: date-time }

    AddLoginKey:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string
          description: In authorized_keys form, as in ~/.ssh/id_ed25519.pub.
        name:
          type: string
          description: Absent takes the key's own comment.

    StartSignIn:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: What the app calls itself, which the person approving it sees and its token is named.

    SignInGrant:
      type: object
      required: [device_code, user_code, verification_path, expires_at, interval]
      properties:
        device_code:
          type: string
          description: The app's secret, to collect the token with.
        user_code:
          type: string
          description: XXXX-XXXX, shown by the app for the person to compare, or type if their browser asks.
        verification_path:
          type: string
          description: Where on this server the person approves it, the code in it.
        expires_at: { type: string, format: date-time }
        interval:
          type: integer
          description: Seconds between asks for the token.

    FinishSignIn:
      type: object
      required: [device_code]
      properties:
        device_code: { type: string }

    SignInToken:
      type: object
      required: [token, name]
      properties:
        token: { type: string }
        name: { type: string }

    ImageUpdate:
      type: object
      description: >-
        A newer copy of the environment's image its worker holds, and what
        upgrading to it would hide: files the environment has changed that
        the newer copy also changes keep the environment's version.
      required: [digest, checked]
      properties:
        digest: { type: string }
        checked:
          type: boolean
          description: Whether its writable disk has been compared with the newer copy, which happens while it is stopped.
        conflicts:
          type: array
          items: { type: string }
        more_conflicts:
          type: integer
          description: How many more there are than conflicts lists.
        packages:
          type: boolean
          description: The package manager's database is among them.
        error:
          type: string
          description: Why the comparison failed.

    ImageRollback:
      type: object
      description: The copy of its writable disk kept from before its last upgrade, which a rollback restores.
      required: [digest, at, size_bytes]
      properties:
        digest: { type: string }
        at: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64 }

    Access:
      type: object
      description: >-
        What of its owner's the environment is kept from, for code they do
        not trust, as its template says. Each is false, giving it
        everything, when left out.
      properties:
        no_self_attached:
          type: boolean
          description: >-
            Only the packs the template lists: none of those attaching
            themselves to environments, the profile among them.
        no_sensitive_files:
          type: boolean
          description: None of the sensitive files -- credentials, such as Claude's sign-in -- of its packs.
        no_ssh_keys:
          type: boolean
          description: No signatures from the owner's SSH keys.
        no_registry:
          type: boolean
          description: No credential for Hangar's registry.
        no_editor_trust:
          type: boolean
          description: The editor trusts no folder to run its code (its language servers) until the person trusts it.

    EnvironmentSettings:
      type: object
      required: [cpus, memory_mib, display, gpu]
      additionalProperties: false
      properties:
        cpus: { type: integer, minimum: 1 }
        memory_mib: { type: integer, minimum: 1 }
        display:
          type: string
          enum: [none, desktop]
        gpu:
          type: string
          enum: [none, virtual, passthrough]
        dax:
          type: boolean
          description: Map the image's files from the worker's memory rather than read them into the environment's own.
        swap_mib:
          type: integer
          minimum: 0
          maximum: 262144
          description: Its swap, in MiB. Absent is its worker's default; 0 is none.

    Template:
      type: object
      description: What an environment made from it is given.
      required: [id, name, description, owner, cpus, memory_mib, display, gpu, image, repos]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        owner:
          type: string
          description: The username of who made it or took it on.
        team:
          type: string
          description: The name of the team that owns it, when one does.
        cpus: { type: integer }
        memory_mib: { type: integer }
        display:
          type: string
          description: none or desktop. More may come.
        gpu:
          type: string
          description: none, virtual or passthrough. More may come.
        dax: { type: boolean }
        swap_mib:
          type: integer
          description: Its environments' swap, in MiB. Absent is the worker's default; 0 is none.
        image: { type: string }
        repos:
          type: array
          description: >-
            What it clones, its ref, path and branch able to use variables
            filled in as each environment is made: {name}, {owner},
            {short_id}, {template}, and the name pattern's named groups.
          items: { $ref: "#/components/schemas/Repo" }
        projects:
          type: array
          description: The folders its editor opens, by default its repositories'.
          items: { type: string }
        name_pattern:
          type: string
          description: A regular expression an environment's whole name must match.
        name_hint:
          type: string
          description: What name the pattern wants, in words.

    Repo:
      type: object
      required: [url, path]
      additionalProperties: false
      properties:
        url: { type: string, minLength: 1 }
        ref:
          type: string
          description: Branch, tag or commit to check out; empty for the default branch.
        path:
          type: string
          description: Where in the environment to clone it.
        branch:
          type: string
          description: A new branch to make after cloning.

    CreateEnvironment:
      type: object
      required: [template_id, name]
      additionalProperties: false
      properties:
        template_id: { type: string }
        name:
          type: string
          description: >-
            A DNS label in either case, since it becomes the hostname in lower
            case, and whatever else the template's name pattern demands.
        settings: { $ref: "#/components/schemas/EnvironmentSettings" }
        repos:
          type: array
          description: >-
            The repositories to clone in place of the template's, which may
            use its variables as its own do.
          items: { $ref: "#/components/schemas/Repo" }

    Resources:
      type: object
      required: [cpus, memory_mib]
      properties:
        cpus: { type: integer }
        memory_mib: { type: integer }

    EnvironmentPack:
      type: object
      required: [id, name, description, builtin, copy, from, listed, copies]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        owner: { type: string, description: Its owner's username, for a person's pack. }
        team: { type: string, description: Its team's slug, for a team's pack. }
        builtin:
          type: boolean
          description: The server's own, such as the profile.
        copy: { $ref: "#/components/schemas/PackCopy" }
        from:
          type: string
          description: >-
            How the copy was chosen -- environment (chosen on it), template
            (its template's pin), kept (the one it was first given) or
            default (its owner's). More may come.
        listed:
          type: boolean
          description: Its template lists it, rather than its attaching itself.
        copies:
          type: array
          description: The copies of it the user may choose from.
          items: { $ref: "#/components/schemas/PackCopy" }

    PackCopy:
      type: object
      description: One set of a pack's files.
      required: [id, name, personal]
      properties:
        id: { type: string }
        name: { type: string }
        owner: { type: string, description: Its owner's username, for a person's copy. }
        team: { type: string, description: Its team's slug, for a team's copy. }
        personal:
          type: boolean
          description: A person's own copy, one each.

    AccessToken:
      type: object
      required: [id, name, created_at, current]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current:
          type: boolean
          description: Whether this request came with it.

    SSHKey:
      type: object
      required: [id, name, public_key, fingerprint, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        public_key:
          type: string
          description: In authorized_keys form, for adding where it should be let in.
        fingerprint: { type: string }
        created_at: { type: string, format: date-time }

    GenerateSSHKey:
      type: object
      required: [name]
      properties:
        name: { type: string }

    Environment:
      type: object
      required: [id, short_id, name, owner_id, owner, template, phase, desired, created_at, updated_at]
      properties:
        id: { type: string }
        short_id:
          type: string
          description: >-
            Six characters that name the environment on the whole server:
            the SSH gateway takes it as the username, as <short_id>@<host>,
            whoever owns the environment.
        name: { type: string }
        owner_id: { type: string }
        owner:
          type: string
          description: The owner's username.
        template: { type: string }
        phase:
          type: string
          description: >-
            What it is doing, as its worker last reported: pending, starting,
            running, stopping, stopped, suspending, suspended, failed,
            deleting. More may come; treat one you do not know as busy.
        desired:
          type: string
          description: What its owner asked for -- running, stopped, suspended or deleted. More may come.
        reason:
          type: string
          description: Why it is in its phase, when there is more to say.
        progress: { $ref: "#/components/schemas/StartProgress" }
        worker:
          type: string
          description: The worker it runs on, once placed.
        worker_online:
          type: boolean
          description: >-
            Whether the worker it is placed on has reported in the last 45
            seconds. While it has not, phase is what it last reported, which
            may no longer be so: a worker that stopped or lost its connection
            leaves its environments as they were said to be.
        editor_path:
          type: string
          description: >-
            The folder an editor opens in it: its first project.
        workspace_file:
          type: string
          description: >-
            Where in it a workspace file (.code-workspace) of its projects is,
            when it has more than one, for an editor to open in place of
            editor_path.
        display:
          type: string
          description: Its display -- none or desktop. More may come.
        cpus: { type: integer }
        memory_mib: { type: integer }
        ports_public:
          type: boolean
          description: >-
            Whether anyone may reach its own web servers without signing in
            to Hangar.
        web_names:
          type: array
          description: The names of its own web servers its template lists.
          items: { type: string }
        gpu:
          type: string
          description: >-
            none; virtual, rendering through a GPU shared with other
            environments; or passthrough, a whole physical GPU. More may come.
        dax:
          type: boolean
          description: Its image's files are mapped from its worker's memory rather than read into its own.
        swap_mib:
          type: integer
          description: >-
            Its swap, in MiB. Absent is its worker's default (as much as its
            memory, unless the worker is set otherwise); 0 is none.
        access: { $ref: "#/components/schemas/Access" }
        placement:
          type: object
          description: What a worker's labels must say for it to run there, from its template.
          additionalProperties: { type: string }
        template_id: { type: string }
        template_changes:
          type: array
          description: >-
            The settings it has that its template has since changed, which a
            reset to the template gives it: image, cpus, memory, display, gpu,
            dax, swap, repos, projects, access, trusted_folders, web_names,
            packs, placement, name. More may come.
          items: { type: string }
        image:
          type: string
          description: The image it runs, as its template names it.
        image_digest:
          type: string
          description: The copy of the image it runs.
        task: { $ref: "#/components/schemas/Task" }
        image_update: { $ref: "#/components/schemas/ImageUpdate" }
        image_rollback: { $ref: "#/components/schemas/ImageRollback" }
        image_change:
          type: string
          description: What its next start does to its image -- upgrade or rollback.
        stats: { $ref: "#/components/schemas/EnvironmentStats" }
        agents:
          type: array
          description: The coding agents' sessions in it, oldest first.
          items: { $ref: "#/components/schemas/AgentSession" }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: When its phase last changed.

    StartProgress:
      type: object
      description: >-
        How far a start has got: its step -- download, unpack, disks, boot,
        network, profile, workspace, in that order, more may come -- and, where the
        step can be measured, done of total in unit (bytes or objects), at
        rate a second lately.
      required: [step]
      properties:
        step: { type: string }
        done: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        unit: { type: string }
        rate: { type: number }

    Task:
      type: object
      description: >-
        What an environment is for: a line its coding agent sets as it
        works, or its owner does.
      required: [id, text, set_by, set_at]
      properties:
        id: { type: string }
        text: { type: string }
        set_by:
          type: string
          description: Who set it -- agent or user. More may come.
        set_at: { type: string, format: date-time }
        done_at:
          type: string
          format: date-time
          description: When it was done, or replaced by another. Absent for the environment's task.

    SetTask:
      type: object
      required: [text]
      properties:
        text: { type: string }

    AgentSession:
      type: object
      description: >-
        A coding agent's session in an environment, as the agent's hooks
        report it: what it is doing, never prompts, commands or file
        contents.
      required: [id, agent, state, since, needs_you]
      properties:
        id:
          type: string
          description: The agent's own ID for the session.
        agent:
          type: string
          description: Which agent -- claude or codex. More may come.
        terminal:
          type: string
          description: The terminal session it runs in, when it runs in one.
        state:
          type: string
          description: >-
            asking (it wants a decision), finished (its turn ended and the
            user has not looked since), working, idle, or ended (its program
            exited). More may come; treat one you do not know as working.
        step:
          type: string
          description: What a working session is doing, such as "Edit src/main.go".
        message:
          type: string
          description: What an asking session asks, in the agent's words.
        since:
          type: string
          format: date-time
          description: When it took its state.
        needs_you:
          type: boolean
          description: Whether it asks or has finished, and the user has not looked since.

    EnvironmentLogName:
      type: string
      description: >-
        combined is the others as one, each line marked with the log it is
        from, in the order the worker saw them written; console is the
        guest's serial console, kernel and systemd; worker what the worker
        logged about the environment; monitor the virtual machine's
        monitor's; gpu the virtual GPU's backend.
      enum: [combined, console, worker, monitor, gpu]

    EnvironmentStats:
      type: object
      description: >-
        What a running environment is using, as its worker last measured.
      required: [cpu_percent, memory_used_mib, memory_total_mib]
      properties:
        cpu_percent:
          type: number
          description: Of its own vCPUs; 100 is all of them busy.
        memory_used_mib:
          type: integer
          description: What its programs use, as the guest sees it.
        memory_total_mib: { type: integer }
        memory_cached_mib:
          type: integer
          description: Its cache of files, which it would give up for its programs.
        host_memory_mib:
          type: integer
          description: The worker's memory its RAM takes up.
        machine_memory_mib:
          type: integer
          description: The memory its machine has, as its monitor says.
        machine_memory_min_mib:
          type: integer
          description: >-
            What its memory can be resized down to as it runs: the size it
            booted with. Absent for a machine that cannot be resized.
        machine_memory_max_mib:
          type: integer
          description: What its memory can be resized up to as it runs.
        swap_total_mib: { type: integer }
        swap_used_mib: { type: integer }
        disk_used_bytes: { type: integer, format: int64 }
        disk_read_bps: { type: number }
        disk_write_bps: { type: number }
        net_rx_bps: { type: number }
        net_tx_bps: { type: number }

    ProcessList:
      type: object
      required: [cpus, memory_bytes, processes]
      properties:
        cpus: { type: integer }
        memory_bytes: { type: integer, format: int64 }
        processes:
          type: array
          items: { $ref: "#/components/schemas/Process" }

    Process:
      type: object
      required: [pid, ppid, user, name, command, state, cpu_percent, rss_bytes, threads, started]
      properties:
        pid: { type: integer }
        ppid: { type: integer }
        user: { type: string }
        name: { type: string }
        command: { type: string }
        state:
          type: string
          description: As /proc gives it -- R running, S sleeping, D waiting on I/O, Z a zombie.
        cpu_percent: { type: number }
        rss_bytes: { type: integer, format: int64 }
        threads: { type: integer }
        started: { type: string, format: date-time }
        protected:
          type: boolean
          description: The guest's init or its agent, which cannot be stopped from here.

    ActivityEvent:
      type: object
      required: [id, at, actor, action, target, details]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor:
          type: object
          required: [kind, name]
          properties:
            kind:
              type: string
              description: user, worker or system. More may come.
            id: { type: string }
            name: { type: string }
        action:
          type: string
          description: What was done, as environment.start or environment.phase.
        target:
          type: object
          required: [type, id, name]
          properties:
            type: { type: string }
            id: { type: string }
            name: { type: string }
        details:
          type: object
          additionalProperties: true

    LogPart:
      type: object
      required: [start, next, size, text]
      properties:
        start:
          type: integer
          format: int64
          description: Where in the log the text begins. The oldest of a long log may be gone.
        next:
          type: integer
          format: int64
          description: The offset to ask for next, to read on from here.
        size:
          type: integer
          format: int64
          description: How long the log is so far.
        text: { type: string }
        missing:
          type: boolean
          description: There is no such log yet, such as for a machine not started, or without a GPU.

    TerminalSession:
      type: object
      required: [id, title, created_at, clients, cols, rows]
      properties:
        id:
          type: string
          description: Also what HANGAR_TERMINAL_SESSION says in it, and an agent session's terminal.
        title:
          type: string
          description: What the shell or the program in it last set as the window title.
        created_at: { type: string, format: date-time }
        clients:
          type: integer
          description: How many windows are attached to it.
        cols: { type: integer }
        rows: { type: integer }
