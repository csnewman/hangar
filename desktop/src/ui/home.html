<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
    <title>Hangar</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="home">
    <main>
      <h1>Open a server</h1>
      <div class="muted">Each server opens in a window of its own, with its environments as tabs.</div>
      <div id="servers"></div>
      <form class="add" id="add">
        <input id="url" type="text" placeholder="Add a server: hangar.example.com" autocomplete="off" spellcheck="false" />
        <button class="btn btn-primary" type="submit">Add server</button>
      </form>
      <div id="message"></div>
    </main>
    <script type="module" src="home.js"></script>
  </body>
</html>
