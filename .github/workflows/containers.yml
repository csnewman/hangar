# Builds hangar-server and hangar-worker and publishes them, so a deployment
# pulls them rather than building from source on every machine:
#
#   ghcr.io/<repository>/server:<sha> and :latest
#   ghcr.io/<repository>/worker:<sha> and :latest
#
# Both are multi-platform, arm64 and amd64. The server cross-compiles, so one
# runner builds both platforms. The worker builds Cloud Hypervisor, the
# backends, the guest kernel and VS Code for the platform it runs on, so each
# platform is built on a runner of that architecture and the two are then
# joined into one index.
name: containers

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'cmd/hangar-server/**'
      - 'cmd/hangar-worker/Dockerfile'
      - '.github/workflows/containers.yml'
  workflow_dispatch:

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  server:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ref
        run: echo "image=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')/server" >> "$GITHUB_OUTPUT"
      # Its build stages run on the runner's platform and cross-compile, and
      # the final stage only copies files in, so no emulation is involved.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/hangar-server/Dockerfile
          build-args: VERSION=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.ref.outputs.image }}:${{ github.sha }}
            ${{ steps.ref.outputs.image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

  worker:
    # Pull requests build the server only: a worker build takes the better
    # part of an hour.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-26.04-arm
          - arch: amd64
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ref
        run: echo "image=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')/worker" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/hangar-worker/Dockerfile
          target: worker
          build-args: VERSION=${{ github.sha }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}:${{ github.sha }}-${{ matrix.arch }}
            ${{ steps.ref.outputs.image }}:latest-${{ matrix.arch }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # The stages that build from source -- Cloud Hypervisor, the
          # kernel, VS Code -- change rarely and are what take the time.
          cache-from: type=gha,scope=worker-${{ matrix.arch }}
          cache-to: type=gha,scope=worker-${{ matrix.arch }},mode=max

  worker-index:
    needs: worker
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-platform index
        run: |
          image=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')/worker
          for tag in ${{ github.sha }} latest; do
            docker buildx imagetools create -t "${image}:${tag}" \
              "${image}:${tag}-arm64" "${image}:${tag}-amd64"
          done
