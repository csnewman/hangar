name: desktop

on:
  push:
    branches: [master]
    paths: [desktop/**, .github/workflows/desktop.yml]
    tags: ['desktop-v*']
  pull_request:
    paths: [desktop/**, .github/workflows/desktop.yml]

jobs:
  check:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Installers for each platform, built on it, for a release tag.
  package:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: check
    strategy:
      matrix:
        include:
          - os: macos-15
            args: --mac
          - os: ubuntu-26.04
            args: --linux
          - os: windows-2025
            args: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # The tag names the version, desktop-v1.2.3 being 1.2.3.
      - run: npm version --no-git-tag-version "${GITHUB_REF_NAME#desktop-v}"
        shell: bash
      - run: npm run dist -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.exe

  release:
    needs: package
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # The Homebrew cask for this release, with its checksums.
      - run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          sed -e "s/@VERSION@/$version/" \
              -e "s/@SHA_ARM64@/$(sha256sum out/Hangar-$version-mac-arm64.zip | cut -d' ' -f1)/" \
              -e "s/@SHA_X64@/$(sha256sum out/Hangar-$version-mac-x64.zip | cut -d' ' -f1)/" \
              desktop/packaging/homebrew/hangar.rb.in > out/hangar.rb
      - uses: softprops/action-gh-release@v2
        with:
          name: Hangar desktop ${{ github.ref_name }}
          files: out/*
      - uses: actions/upload-artifact@v4
        with:
          name: cask
          path: out/hangar.rb

  # The release's cask, into the tap (csnewman/homebrew-hangar) that
  # `brew tap csnewman/hangar` reads. The token writes to that repository
  # alone, and is an environment secret: only a job naming the homebrew
  # environment, run from a desktop-v* tag, is given it. It commits through
  # the API, so GitHub signs the commit.
  tap:
    needs: release
    runs-on: ubuntu-26.04
    environment: homebrew
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cask
      - env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -eu
          path=repos/csnewman/homebrew-hangar/contents/Casks/hangar.rb
          # Updating a file names the blob it replaces; the first release
          # creates it.
          sha=$(gh api "$path" --jq .sha 2>/dev/null || true)
          gh api -X PUT "$path" \
            -f message="hangar ${GITHUB_REF_NAME#desktop-v}" \
            -f content="$(base64 -w0 hangar.rb)" \
            ${sha:+-f sha="$sha"} \
            --jq '.commit.html_url'
