# Builds Hangar's images with mkosi and publishes them for templates to name.
# Each distribution has two tiers, built the way `hangar build` builds them
# locally: minimal, and base on top of it. `hangar oci` writes both as one OCI
# layout -- base is minimal's layer plus one -- and skopeo pushes each tier.
#
#   ghcr.io/<repository>/<tier>:<distro>          e.g. base:ubuntu-26.04
#   ghcr.io/<repository>/<tier>:<family>          the newest release built: base:ubuntu
#   ghcr.io/<repository>/<tier>:<distro>-<sha>    one build, for pinning
name: images

on:
  push:
    branches: [master]
    paths:
      - 'images/**'
      - 'internal/image/**'
      - '.github/workflows/images.yml'
  pull_request:
    paths:
      - 'images/**'
      - 'internal/image/**'
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-26.04, rocky-10]
        arch: [arm64, amd64]
        include:
          - arch: arm64
            runner: ubuntu-26.04-arm
          - arch: amd64
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      # mkosi runs in the same builder container as a local `hangar build`,
      # so a config that builds on a laptop builds here. It builds for the
      # machine it runs on, hence a runner per architecture.
      - name: Build the images
        run: |
          go build -o hangar ./cmd/hangar
          sudo ./hangar build -C images/${{ matrix.distro }} -o out/${{ matrix.distro }} -v
          sudo ./hangar oci -i out/${{ matrix.distro }} -o out/oci -arch ${{ matrix.arch }}

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push each tier
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends skopeo
          repo=$(echo "${{ github.repository }}" | tr 'A-Z' 'a-z')
          for tier in minimal base; do
            sudo skopeo copy --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
              "oci:out/oci:${tier}" \
              "docker://${{ env.REGISTRY }}/${repo}/${tier}:${{ matrix.distro }}-${{ github.sha }}-${{ matrix.arch }}"
          done

  # One index per tier over both architectures, so a template names one
  # reference and each worker pulls its own platform.
  index:
    needs: build
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-26.04, rocky-10]
        tier: [minimal, base]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-platform index
        run: |
          repo=$(echo "${{ github.repository }}" | tr 'A-Z' 'a-z')
          ref="${{ env.REGISTRY }}/${repo}/${{ matrix.tier }}"
          build="${ref}:${{ matrix.distro }}-${{ github.sha }}"
          family=$(echo "${{ matrix.distro }}" | cut -d- -f1)
          docker buildx imagetools create \
            -t "${build}" -t "${ref}:${{ matrix.distro }}" -t "${ref}:${family}" \
            "${build}-arm64" "${build}-amd64"
