name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-26.04
    # The control plane's tests run against a real Postgres; without one they
    # skip, so this is what makes them count.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hangar
          POSTGRES_PASSWORD: hangar
          POSTGRES_DB: hangar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hangar"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # The object store the blob tests and the registry's conformance run
      # use.
      rustfs:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: hangar
          RUSTFS_SECRET_KEY: hangar-ci-secret
          RUSTFS_SSE_S3_MASTER_KEY: aGFuZ2FyLWNpLW9ubHktc3NlLWtleS0wMTIzNDU2Nzg=
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://localhost:9000/health/ready"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      HANGAR_TEST_DATABASE_URL: postgres://hangar:hangar@localhost:5432/hangar?sslmode=disable
      HANGAR_TEST_S3_URL: http://hangar:hangar-ci-secret@localhost:9000/hangar-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      # The frontend API's Go side is generated from its spec and committed;
      # a spec change without a regenerate fails here.
      - name: Check generated code
        run: |
          go generate ./internal/frontendapi ./internal/clientapi
          git diff --exit-code -- internal/frontendapi internal/clientapi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      # Hangar's own registry, through a real server, against the OCI
      # distribution-spec conformance suite. The registry is a subdomain of
      # the server's host, so both names are this machine.
      - name: Registry conformance
        run: |
          echo "127.0.0.1 hangar.test registry.hangar.test" | sudo tee -a /etc/hosts
          PGPASSWORD=hangar createdb -h localhost -U hangar conformance
          HANGAR_DATABASE_URL=postgres://hangar:hangar@localhost:5432/conformance?sslmode=disable \
          HANGAR_BLOB_URL=http://hangar:hangar-ci-secret@localhost:9000/conformance \
            dev/registry-conformance.sh
      # A function no program or test reaches is one a refactor left behind.
      # deadcode reports them and exits 0 either way, so any output fails.
      - name: Check for unreachable code
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.50.0
          unreachable=$(deadcode -test ./...)
          if [ -n "$unreachable" ]; then
            echo "Unreachable, and so to be removed:"; echo "$unreachable"; exit 1
          fi

  web:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check generated types
        run: |
          npm run gen:api
          git diff --exit-code -- src/gen
      - run: npm run lint
      - run: npm run build

  code:
    # The Code tab's service, which runs in the guest. Its tests start it
    # against a scratch repository and drive it as the browser does.
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: editor/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editor/code/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  vscode:
    # The desktop extension, packaged as a .vsix to install by hand.
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check extension.js
      - run: npx --yes @vscode/vsce package --skip-license
      - uses: actions/upload-artifact@v4
        with:
          name: hangar-vscode
          path: vscode/*.vsix

  kernel:
    # Resolves the guest kernel's config on each architecture and checks every
    # option the fragments ask for is built in. Compiling it takes the best
    # part of an hour and happens in the worker image's build.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04-arm, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: go run ./cmd/hangar kernel --config-only -o out/kernel -v

  fs:
    # hangar-fs needs nothing from the host at build time; running it needs a
    # monitor to connect to, which is not done here.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04-arm, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: fs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fs
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  gpu:
    # hangar-gpu links against virglrenderer with the patches in
    # gpu/virglrenderer applied: the snapshot API it calls exists nowhere
    # else. That build is cached on the patches and the script that applies
    # them, so it reruns only when they change.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04-arm, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: gpu
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config python3-yaml python3-mako \
            libepoxy-dev libdrm-dev libgbm-dev libvulkan-dev libegl-dev \
            clang libclang-dev
      - id: virgl-cache
        uses: actions/cache@v4
        with:
          path: /opt/virgl
          key: virgl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gpu/virglrenderer/**') }}
      - name: Build patched virglrenderer
        if: steps.virgl-cache.outputs.cache-hit != 'true'
        run: sudo sh virglrenderer/build.sh /opt/virgl
      - name: Point the build at it
        run: |
          lib=$(dirname "$(dirname "$(find /opt/virgl -name virglrenderer.pc)")")
          echo "PKG_CONFIG_PATH=$lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$lib" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpu
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
