name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-26.04
    # The control plane's tests run against a real Postgres; without one they
    # skip, so this is what makes them count.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hangar
          POSTGRES_PASSWORD: hangar
          POSTGRES_DB: hangar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hangar"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      HANGAR_TEST_DATABASE_URL: postgres://hangar:hangar@localhost:5432/hangar?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      # The frontend API's Go side is generated from its spec and committed;
      # a spec change without a regenerate fails here.
      - name: Check generated code
        run: |
          go generate ./internal/frontendapi
          git diff --exit-code -- internal/frontendapi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check generated types
        run: |
          npm run gen:api
          git diff --exit-code -- src/gen
      - run: npm run lint
      - run: npm run build

  vmm:
    # hangar-vmm links against KVM's headers only through kvm-bindings, so it
    # builds anywhere; running a guest needs /dev/kvm and is not done here.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04-arm, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vmm
      - run: cargo fmt --check
        working-directory: vmm
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: vmm
      - run: cargo test
        working-directory: vmm
