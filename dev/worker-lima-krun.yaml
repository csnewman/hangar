# A second worker in the Lima VM, running environments under libkrun on KVM
# beside dev/worker-lima.yaml's Cloud Hypervisor, to compare the two (see
# dev/lima-krun-worker.sh). Everything it keeps is under /var/lib/hangar-krun;
# it only reads the images built under /var/lib/hangar.
server:
  url: http://host.lima.internal:8080
  token_file: /Users/csnewman/Projects/hangar/dev/bootstrap-token
  credential_file: /var/lib/hangar-krun/worker-credential

node:
  name: lima-krun
  labels:
    runtime: krun
    kvm: "true"
    host: lima

storage:
  images: /var/lib/hangar-krun/images
  environments: /var/lib/hangar-krun/env
  caches: /var/lib/hangar-krun/caches
  # Its own, as the Mac worker's: the control plane sees the other worker's.
  files: /var/lib/hangar-krun/files

# The VM's memory is shared with the Cloud Hypervisor worker, which offers
# all of it: this one offers about 5 GiB.
reserved:
  cpus: 1
  memory: 7GiB

overcommit:
  cpus: 4

runtime: krun

vm:
  kernel: /Users/csnewman/Projects/hangar/out/kernel/vmlinuz
  # Built for the guest by dev/lima-worker.sh and dev/lima-krun-worker.sh:
  # each boot's initramfs, as init, and then the agent.
  agent: /var/tmp/hangar-agent-guest
  # VS Code's server, built by `editor/build.sh` in this VM.
  editor: /Users/csnewman/Projects/hangar/out/editor/editor-arm64.ext4
  # Environments with a virtual GPU get OpenGL (virgl) and Vulkan (Venus)
  # from this VM's virglrenderer, as under Cloud Hypervisor.
  gpu:
    venus: true
  images:
    # Each image's root filesystem, made into an EROFS image on first boot.
    # Built in this VM, both tiers of a distribution at once, by
    #   sudo /var/tmp/hangar build -C images/ubuntu-26.04 -o /var/lib/hangar/image-src/ubuntu-26.04
    # They live on the VM's own disk, not the Mac's mount: the trees must keep
    # their root owners.
    ghcr.io/csnewman/hangar/base:ubuntu-26.04:
      base: /var/lib/hangar/image-src/ubuntu-26.04/base/rootfs
    ghcr.io/csnewman/hangar/minimal:ubuntu-26.04:
      base: /var/lib/hangar/image-src/ubuntu-26.04/minimal/rootfs
    ghcr.io/csnewman/hangar/base:rocky-10:
      base: /var/lib/hangar/image-src/rocky-10/base/rootfs
    ghcr.io/csnewman/hangar/minimal:rocky-10:
      base: /var/lib/hangar/image-src/rocky-10/minimal/rootfs
