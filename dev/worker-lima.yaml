# A worker that runs real environments, inside the Lima VM (see
# dev/lima-worker.sh). It dials the control plane in compose.yaml on the Mac
# through Caddy, which Lima publishes to the VM as host.lima.internal.
server:
  url: http://host.lima.internal:8080
  token_file: /Users/csnewman/Projects/hangar/dev/bootstrap-token
  credential_file: /var/lib/hangar/worker-credential

node:
  name: lima
  labels:
    runtime: cloud-hypervisor
    kvm: "true"

storage:
  images: /var/lib/hangar/images
  environments: /var/lib/hangar/env
  caches: /var/lib/hangar/caches

reserved:
  cpus: 1
  memory: 2GiB

runtime: cloud-hypervisor

vm:
  kernel: /Users/csnewman/Projects/hangar/out/kernel/vmlinuz
  # Built by dev/lima-worker.sh for the guest: each boot's initramfs, as
  # init, and then the agent.
  agent: /var/tmp/hangar-agent-guest
  # VS Code's server, built by `editor/build.sh` in this VM.
  editor: /Users/csnewman/Projects/hangar/out/editor/editor-arm64.ext4
  dax_mib: 1024
  images:
    # The image's root filesystem, served over virtio-fs. Built in this VM by
    #   sudo /var/tmp/hangar build -C images/ubuntu2604 -o /var/lib/hangar/image-src/ubuntu2604
    # It lives on the VM's own disk, not the Mac's mount: the tree must keep
    # its root owners.
    ghcr.io/csnewman/hangar/base-ubuntu2604:latest:
      base: /var/lib/hangar/image-src/ubuntu2604/rootfs
