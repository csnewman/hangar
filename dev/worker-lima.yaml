# A worker that runs real environments, inside the Lima VM (see
# dev/lima-worker.sh). It dials the control plane in compose.yaml on the Mac
# through Caddy, which Lima publishes to the VM as host.lima.internal.
server:
  url: http://host.lima.internal:8080
  token_file: /Users/csnewman/Projects/hangar/dev/bootstrap-token
  credential_file: /var/lib/hangar/worker-credential

node:
  name: lima
  labels:
    runtime: cloud-hypervisor
    kvm: "true"

storage:
  images: /var/lib/hangar/images
  environments: /var/lib/hangar/env
  caches: /var/lib/hangar/caches

reserved:
  cpus: 1
  memory: 2GiB

# The VM has few cores and environments are mostly idle. Memory is not
# overcommitted: the VM has no swap.
overcommit:
  cpus: 4

runtime: cloud-hypervisor

vm:
  kernel: /Users/csnewman/Projects/hangar/out/kernel/vmlinuz
  # Built by dev/lima-worker.sh for the guest: each boot's initramfs, as
  # init, and then the agent.
  agent: /var/tmp/hangar-agent-guest
  # VS Code's server, built by `editor/build.sh` in this VM.
  editor: /Users/csnewman/Projects/hangar/out/editor/editor-arm64.ext4
  dax_mib: 1024
  # Environments with a virtual GPU get Vulkan too: this VM's virglrenderer
  # is built with Venus (AGENTS.md). venus_restore carries a Vulkan program
  # across a suspend, and is experimental.
  gpu:
    venus: true
    venus_restore: false
  images:
    # Each image's root filesystem, served over virtio-fs. Built in this VM,
    # both tiers of a distribution at once, by
    #   sudo /var/tmp/hangar build -C images/ubuntu-26.04 -o /var/lib/hangar/image-src/ubuntu-26.04
    # They live on the VM's own disk, not the Mac's mount: the trees must keep
    # their root owners.
    ghcr.io/csnewman/hangar/base:ubuntu-26.04:
      base: /var/lib/hangar/image-src/ubuntu-26.04/base/rootfs
    ghcr.io/csnewman/hangar/minimal:ubuntu-26.04:
      base: /var/lib/hangar/image-src/ubuntu-26.04/minimal/rootfs
    ghcr.io/csnewman/hangar/base:rocky-10:
      base: /var/lib/hangar/image-src/rocky-10/base/rootfs
    ghcr.io/csnewman/hangar/minimal:rocky-10:
      base: /var/lib/hangar/image-src/rocky-10/minimal/rootfs
